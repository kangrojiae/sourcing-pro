<title>Sourcing Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  :root{
    --bg:#f4f6f8;
    --line:#e8ebee;
    --line2:#eef1f4;
    --text:#1f2937;
    --sub:#8a93a0;
    --sub2:#a3abb6;
    --teal:#12a58c;
    --teal-d:#0e8f79;
    --teal-l:#e8f7f3;
    --orange:#f5642d;
    --orange-l:#fff1ec;
    --red:#e5484d;
    --green:#16a34a;
    --amber:#f5a524;
    --radius:16px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.05);
    --font:"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    font-size:13px;
    -webkit-font-smoothing:antialiased;
  }
  input,select,textarea{font-family:inherit;}
  button{
    font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;
    transition:transform .07s ease, filter .07s ease;
  }
  button:active:not(:disabled){transform:scale(.97);filter:brightness(.94);}
  button:disabled{cursor:not-allowed;opacity:.55;}
  /* 누른 직후, 화면이 다시 그려지기 전까지 잠깐 보여주는 표시 */
  button.pressing{transform:scale(.97);filter:brightness(.94);}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .num{font-variant-numeric:tabular-nums;}

  /* ================= AUTH ================= */
  .auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 424px;background:var(--bg);}
  .auth-side{
    background:#141b24;color:#e6ebf1;padding:56px 52px;display:flex;flex-direction:column;gap:34px;justify-content:center;
  }
  .auth-side h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-1px;color:#fff;}
  .auth-side h1 span{color:var(--orange);}
  .auth-side .tag{margin:9px 0 0;font-size:13px;color:#8f9bab;letter-spacing:-.3px;}
  .auth-feat{display:flex;flex-direction:column;gap:14px;max-width:470px;}
  .auth-feat div{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:#b6c0cd;line-height:1.55;letter-spacing:-.2px;}
  .auth-feat b{color:#fff;font-weight:700;}
  .auth-feat i{
    flex:0 0 20px;width:20px;height:20px;border-radius:6px;background:#23303d;color:var(--teal);
    font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .auth-demo{background:#1b232d;border:1px solid #26313d;border-radius:14px;padding:16px 18px;max-width:470px;}
  .auth-demo .cap{font-size:10px;font-weight:700;letter-spacing:.8px;color:#6d7b8b;text-transform:uppercase;}
  .auth-demo .row{display:flex;gap:26px;margin-top:12px;flex-wrap:wrap;}
  .auth-demo .row div{min-width:0;}
  .auth-demo .k{font-size:10.5px;color:#7d8b9a;letter-spacing:-.2px;}
  .auth-demo .v{margin-top:4px;font-size:17px;font-weight:800;letter-spacing:-.5px;color:#e9eef4;}
  .auth-demo .v.good{color:#3ddc9a;}
  .auth-main{background:#fff;display:flex;align-items:center;justify-content:center;padding:40px 44px;border-left:1px solid var(--line);}
  .auth-card{width:100%;max-width:328px;}
  .auth-card h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.6px;color:#1b222c;}
  .auth-card .lead{margin:8px 0 26px;font-size:12.5px;color:var(--sub);letter-spacing:-.2px;line-height:1.6;}
  .auth-card label{display:block;font-size:11.5px;color:#6b7480;font-weight:600;margin:14px 0 7px;letter-spacing:-.2px;}
  .auth-card input{
    width:100%;border:1px solid #e3e7ec;border-radius:9px;padding:11px 12px;font-size:13px;
    color:#333c48;background:#fff;outline:none;letter-spacing:-.2px;
  }
  .auth-card input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(18,165,140,.10);}
  .auth-submit{
    width:100%;margin-top:22px;background:linear-gradient(135deg,#1cb894,#0f9c86);color:#fff;border-radius:10px;
    padding:12px 0;font-size:13.5px;font-weight:700;letter-spacing:-.2px;box-shadow:0 3px 10px rgba(18,165,140,.28);
  }
  .auth-alt{margin-top:16px;text-align:center;font-size:12px;color:var(--sub);letter-spacing:-.2px;}
  .auth-alt button{color:var(--teal);font-weight:700;text-decoration:underline;text-underline-offset:2px;}
  .auth-err{
    margin-top:16px;background:#fff1f1;border:1px solid #ffd9d9;color:#c53236;border-radius:9px;
    padding:10px 12px;font-size:11.5px;line-height:1.5;letter-spacing:-.2px;
  }
  .auth-note{margin-top:24px;padding-top:16px;border-top:1px solid var(--line2);font-size:10.5px;color:var(--sub2);line-height:1.6;letter-spacing:-.2px;}

  /* ================= LAYOUT ================= */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:208px;flex:0 0 208px;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .brand{padding:22px 20px 18px;}
  .brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.4px;color:#242c38;}
  .brand h1 span{color:var(--orange);}
  .brand p{margin:5px 0 0;font-size:9.5px;color:var(--sub2);letter-spacing:-.5px;white-space:nowrap;}
  .nav{padding:6px 12px;display:flex;flex-direction:column;gap:2px;}
  .nav a{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    color:#6b7480;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.2px;
  }
  .nav a:hover{background:#f6f7f9;}
  .nav a.active{background:var(--orange-l);color:var(--orange);font-weight:700;}
  .nav a.active svg{stroke:var(--orange);}
  .nav svg{width:16px;height:16px;stroke:#98a1ac;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 16px;}
  .nav .tagme{margin-left:auto;font-size:9px;font-weight:800;color:#fff;background:#2b3542;border-radius:5px;padding:2px 5px;letter-spacing:0;}
  .nav-div{height:1px;background:var(--line2);margin:12px 20px;}
  .ext-box{margin:auto 14px 18px;border-radius:14px;padding:13px 12px;border:1px solid var(--line);background:#fbfcfd;}
  .ext-box .st{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:-.2px;color:#3f4753;}
  .dot{width:7px;height:7px;border-radius:50%;background:#cfd5dc;flex:0 0 7px;}
  .dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.14);}
  .dot.off{background:#cbd2d9;}
  .ext-box p{margin:7px 0 0;font-size:10.5px;color:var(--sub);line-height:1.55;letter-spacing:-.2px;}
  .ext-box button{
    width:100%;margin-top:10px;background:#2b3542;color:#fff;border-radius:9px;padding:8px 0;
    font-size:11px;font-weight:700;letter-spacing:-.2px;
  }

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 24px;border-bottom:1px solid var(--line);background:#fff;
  }
  .crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);min-width:0;}
  .crumbs svg{width:15px;height:15px;stroke:#a3abb6;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 15px;}
  .crumbs .sep{color:#cfd5dc;}
  .crumbs .cur{color:#3f4753;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .top-right{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .ghost-btn{
    display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
    padding:8px 14px;border-radius:9px;font-size:12.5px;color:#5b6472;font-weight:500;
  }
  .ghost-btn svg{width:14px;height:14px;stroke:#7d8794;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .user{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#3f4753;font-weight:600;}
  .avatar{width:26px;height:26px;border-radius:50%;background:#eef1f4;display:flex;align-items:center;justify-content:center;flex:0 0 26px;}
  .avatar svg{width:14px;height:14px;stroke:#98a1ac;stroke-width:1.8;fill:none;}
  .role-chip{font-size:9.5px;font-weight:800;letter-spacing:-.1px;padding:3px 6px;border-radius:6px;background:#eef1f4;color:#6b7480;}
  .role-chip.admin{background:#2b3542;color:#fff;}

  .page{padding:20px 24px 34px;flex:1;}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px;}
  .page-head h2{margin:0;font-size:25px;font-weight:800;letter-spacing:-.8px;color:#1b222c;}
  .page-head p{margin:7px 0 0;font-size:12.5px;color:var(--sub);letter-spacing:-.2px;}
  .actions{display:flex;align-items:center;gap:9px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .act{
    display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    padding:10px 16px;border-radius:10px;font-size:12.5px;font-weight:600;color:#4f5866;box-shadow:var(--shadow);
  }
  .act svg{width:15px;height:15px;stroke:#6f7885;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .act.primary{
    background:linear-gradient(135deg,#1cb894,#0f9c86);color:#fff;border:none;
    box-shadow:0 3px 10px rgba(18,165,140,.28);padding:10px 20px;
  }
  .act.primary svg{stroke:#fff;}
  .act.danger{color:var(--red);border-color:#f6d5d6;}
  .act.danger svg{stroke:var(--red);}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .cols{display:grid;grid-template-columns:404px minmax(0,1fr);gap:18px;align-items:start;}

  /* ================= COUPANG PANEL ================= */
  .cp{border:1.5px solid #ffd9c9;overflow:hidden;}
  .cp-head{display:flex;align-items:center;gap:11px;padding:16px 18px;background:#fff6f2;border-bottom:1px solid #ffe6da;}
  .cp-logo{width:34px;height:34px;border-radius:9px;background:#f13d2c;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:0 0 34px;}
  .cp-head h3{margin:0;font-size:15px;font-weight:800;color:#e14a22;letter-spacing:-.3px;}
  .src-chip{
    margin-left:auto;flex-shrink:0;color:#fff;border-radius:20px;padding:4px 10px;
    font-size:10.5px;font-weight:800;letter-spacing:-.2px;
  }
  .src-tag{
    display:inline-block;color:#fff;border-radius:5px;padding:1px 5px;
    font-size:9.5px;font-weight:800;letter-spacing:-.2px;vertical-align:1px;
  }
  .cp-head p{margin:3px 0 0;font-size:11.5px;color:#b58a78;letter-spacing:-.2px;}
  .cp-body{padding:18px;}
  .prod{display:flex;gap:14px;}
  .thumb{
    width:104px;height:104px;flex:0 0 104px;border-radius:13px;background:#fdeef0;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .prod-info{min-width:0;flex:1;}
  .prod-info .pname{font-size:13.5px;font-weight:700;line-height:1.45;letter-spacing:-.3px;color:#242c38;word-break:break-word;}
  .prod-info .pname.empty{color:var(--sub2);font-weight:500;}
  .cat{margin-top:7px;font-size:11px;color:var(--sub2);letter-spacing:-.2px;word-break:break-all;}
  .price{margin-top:8px;font-size:21px;font-weight:800;color:#f13d2c;letter-spacing:-.6px;}
  .rate{margin-top:7px;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--sub);flex-wrap:wrap;}
  .rate b{color:var(--amber);font-weight:700;}
  .rate .star{color:var(--amber);}
  .rate .bar{color:#dfe3e8;}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  .stat{background:#f7f9fa;border:1px solid #edf0f3;border-radius:11px;padding:12px 13px;}
  .stat .k{font-size:11px;color:var(--sub);letter-spacing:-.2px;}
  .stat .v{margin-top:5px;font-size:17px;font-weight:800;letter-spacing:-.5px;color:#222a35;}

  .field{margin-top:16px;}
  .field label{display:block;font-size:11.5px;color:#6b7480;font-weight:600;margin-bottom:7px;letter-spacing:-.2px;}
  .input-row{display:flex;gap:8px;}
  .input{
    flex:1;min-width:0;border:1px solid #e3e7ec;border-radius:9px;padding:10px 12px;
    font-size:12px;color:#5b6472;background:#fff;outline:none;letter-spacing:-.2px;
  }
  .input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(18,165,140,.10);}
  .icon-btn{
    width:38px;flex:0 0 38px;border:1px solid #e3e7ec;border-radius:9px;background:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{background:#f7f9fa;}
  .icon-btn svg{width:15px;height:15px;stroke:#7d8794;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .grab-btn{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--teal);color:#fff;border-radius:9px;
    padding:0 14px;font-size:11.5px;font-weight:700;letter-spacing:-.2px;
  }
  .grab-btn svg{width:13px;height:13px;stroke:#fff;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .grab-btn.busy{background:#9fb3b0;}
  .suffix{position:relative;flex:1;display:flex;}
  .suffix .input{padding-right:34px;font-weight:600;color:#333c48;}
  .suffix span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:#9aa3ae;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ================= 1688 PANEL ================= */
  .cn{border:1.5px solid #c9ece4;overflow:hidden;}
  .cn-head{display:flex;align-items:center;gap:11px;padding:16px 18px;background:#eefaf6;border-bottom:1px solid #d6f0e9;flex-wrap:wrap;}
  .cn-logo{
    width:52px;height:34px;border-radius:9px;background:#1668c8;color:#fff;font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;flex:0 0 52px;letter-spacing:-.3px;
  }
  .cn-head h3{margin:0;font-size:15px;font-weight:800;color:#0f8f78;letter-spacing:-.3px;}
  .cn-head p{margin:3px 0 0;font-size:11.5px;color:#7fa79d;letter-spacing:-.2px;}
  .hint{
    margin-left:auto;display:flex;align-items:center;gap:7px;background:#fffaeb;border:1px solid #fceec4;
    border-radius:9px;padding:8px 13px;font-size:11.5px;color:#9a7b3a;letter-spacing:-.2px;flex-shrink:0;
  }
  .find1688{
    margin-left:auto;display:flex;align-items:center;gap:7px;background:#123c34;color:#fff;
    border-radius:10px;padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:-.2px;flex-shrink:0;
    box-shadow:0 2px 8px rgba(18,60,52,.22);
  }
  .find1688 svg{width:14px;height:14px;stroke:#fff;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .find1688.busy{background:#5c6b66;box-shadow:none;}
  .find1688.alt{background:var(--teal);margin-left:8px;}
  .assist{
    margin:0 16px 4px;padding:13px 16px;background:#fffaeb;border:1px solid #fceec4;border-radius:12px;
    font-size:11.5px;color:#9a7b3a;line-height:1.75;letter-spacing:-.2px;
  }
  .assist b{color:#7d6229;}
  .assist .ai{
    display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:5px;
    background:#9a7b3a;color:#fff;font-size:9.5px;font-weight:800;margin-right:7px;vertical-align:middle;
  }
  .assist .ai:not(:first-child){margin-left:0;margin-top:8px;}
  .cn-head .hint{margin-left:0;}
  .srcname{
    background:#f7f9fa;border:1px solid var(--line2);border-radius:9px;padding:10px 12px;
    font-size:12px;color:#3f4753;line-height:1.6;letter-spacing:-.2px;word-break:break-word;
  }
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    border:1px solid #cfe9e2;background:#fff;color:var(--teal);border-radius:20px;
    padding:6px 13px;font-size:12px;font-weight:700;letter-spacing:-.2px;
  }
  .chip:hover{background:var(--teal-l);}

  .cn-body{padding:16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;}

  .item{border:1.5px solid #e9edf1;border-radius:13px;padding:12px;background:#fff;transition:.15s;position:relative;}
  .item.sel{border-color:var(--teal);box-shadow:0 0 0 3px rgba(18,165,140,.10);}
  .item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .idx{
    width:22px;height:22px;border-radius:7px;background:#eef1f4;color:#7d8794;
    font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  }
  .item.sel .idx{background:#123c34;color:#fff;}
  .item-top .right{display:flex;align-items:center;gap:6px;}
  .clear-x{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
  .clear-x svg{width:11px;height:11px;stroke:#b6bec7;stroke-width:2.2;fill:none;stroke-linecap:round;}
  .clear-x:hover{background:#f4f6f8;}
  .clear-x:hover svg{stroke:var(--red);}
  .radio{
    width:17px;height:17px;border-radius:50%;border:1.6px solid #d7dde3;background:#fff;
    display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 17px;
  }
  .item.sel .radio{border-color:var(--teal);}
  .radio i{display:none;width:8px;height:8px;border-radius:50%;background:var(--teal);}
  .item.sel .radio i{display:block;}
  .item-img{
    width:100%;aspect-ratio:1/1;border-radius:11px;background:#f5f6f8;
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;
  }
  .item-img img{width:100%;height:100%;object-fit:cover;}
  .item-name{font-size:12px;font-weight:700;line-height:1.45;letter-spacing:-.3px;color:#2a323d;min-height:34px;word-break:break-word;}
  .item-name.empty{color:var(--sub2);font-weight:500;}
  .src-chip{
    display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;border-radius:5px;
    padding:2px 6px;margin-bottom:6px;letter-spacing:-.2px;
  }
  .src-chip.img{background:#eef4ff;color:#3b82f6;}
  .src-chip.nm{background:#fff3ec;color:#e8622c;}
  .src-chip.warn{background:#fff1f1;color:#c53236;margin-left:5px;}
  .best{
    position:absolute;top:-9px;left:12px;background:var(--green);color:#fff;font-size:9.5px;font-weight:800;
    border-radius:6px;padding:3px 7px;letter-spacing:-.2px;box-shadow:0 2px 6px rgba(22,163,74,.3);
  }
  .urlrow{margin-top:9px;display:flex;gap:5px;}
  .urlrow input{
    flex:1;min-width:0;border:1px solid #e6eaee;border-radius:8px;padding:7px 9px;font-size:10.5px;
    color:#5b6472;outline:none;background:#fff;
  }
  .urlrow input:focus{border-color:var(--teal);}
  .btns{display:flex;gap:6px;margin-top:8px;}
  .b-fill{
    flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--teal);color:#fff;
    border-radius:8px;padding:8px 0;font-size:11px;font-weight:700;letter-spacing:-.2px;
  }
  .b-fill.busy{background:#9fb3b0;}
  .b-fill svg{width:12px;height:12px;stroke:#fff;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .b-out{
    flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid #cfe9e2;color:#12a58c;
    border-radius:8px;padding:8px 0;font-size:11px;font-weight:700;background:#fff;letter-spacing:-.2px;text-decoration:none;
  }
  .b-out svg{width:12px;height:12px;stroke:#12a58c;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .f{margin-top:11px;}
  .f label{display:block;font-size:10.5px;color:#8a93a0;font-weight:600;margin-bottom:6px;letter-spacing:-.2px;}
  .f input{
    width:100%;border:1px solid #e3e7ec;border-radius:8px;padding:8px 10px;font-size:12px;
    color:#333c48;font-weight:600;outline:none;background:#fff;letter-spacing:-.2px;
  }
  .f input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(18,165,140,.10);}
  .f input.plain{font-weight:500;color:#5b6472;}
  .mini-profit{
    margin-top:11px;border-top:1px dashed #e6eaee;padding-top:9px;display:flex;align-items:baseline;justify-content:space-between;
  }
  .mini-profit .k{font-size:10.5px;color:#8a93a0;letter-spacing:-.2px;}
  .mini-profit .v{font-size:13px;font-weight:800;letter-spacing:-.3px;color:var(--green);}
  .mini-profit .v.neg{color:var(--red);}

  /* ================= CALC ================= */
  .calc{margin-top:18px;overflow:hidden;}
  .calc-head{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap;}
  .calc-ico{width:34px;height:34px;border-radius:9px;background:#3b82f6;display:flex;align-items:center;justify-content:center;flex:0 0 34px;}
  .calc-ico svg{width:18px;height:18px;stroke:#fff;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .calc-head h3{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.4px;color:#1b222c;}
  .calc-head .desc{font-size:11.5px;color:var(--sub2);letter-spacing:-.2px;margin-left:2px;}
  .calc-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .fx{background:#f7f9fa;border:1px solid #edf0f3;border-radius:10px;padding:7px 13px;text-align:right;}
  .fx .k{font-size:10px;color:var(--sub2);}
  .fx .v{font-size:11.5px;font-weight:700;color:#3f4753;margin-top:2px;}
  .fx .v em{font-style:normal;color:#c3cad2;margin-right:3px;}
  .fx-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;color:#5b6472;background:#fff;}
  .fx-btn svg{width:14px;height:14px;stroke:#7d8794;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}

  .tiles{padding:18px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;}
  .tile{border-radius:13px;padding:15px;display:flex;gap:12px;align-items:flex-start;}
  .t-ico{width:30px;height:30px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 30px;}
  .t-ico svg{width:15px;height:15px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .tile .k{font-size:11px;font-weight:600;letter-spacing:-.2px;}
  .tile .v{margin-top:6px;font-size:21px;font-weight:800;letter-spacing:-.7px;line-height:1.1;}
  .tile .v small{font-size:11px;font-weight:600;margin-left:3px;}
  .tile .s{margin-top:6px;font-size:10.5px;letter-spacing:-.2px;line-height:1.5;}
  .t1{background:#eef4ff;} .t1 .k{color:#4a6ea8;} .t1 .v{color:#1f4e9c;} .t1 .s{color:#7d97c2;} .t1 .t-ico svg{stroke:#3b82f6;}
  .t2{background:#eafaf5;} .t2 .k{color:#4b8a7c;} .t2 .v{color:#0f7a66;} .t2 .s{color:#84b3a8;} .t2 .t-ico svg{stroke:#12a58c;}
  .t3{background:#f3f0ff;} .t3 .k{color:#7161ad;} .t3 .v{color:#5b46a8;} .t3 .s{color:#a396d1;} .t3 .t-ico svg{stroke:#7c5cf0;}
  .t4{background:#fff3ec;} .t4 .k{color:#b1785c;} .t4 .v{color:#e8622c;} .t4 .s{color:#c9a08c;} .t4 .t-ico svg{stroke:#f5642d;}
  .t5{background:#e9f9ef;} .t5 .k{color:#4d8c65;} .t5 .v{color:#128c4a;} .t5 .s{color:#7fb896;} .t5 .t-ico svg{stroke:#16a34a;}
  .t5.loss{background:#fff1f1;} .t5.loss .k{color:#a8595c;} .t5.loss .v{color:var(--red);} .t5.loss .s{color:#c99295;} .t5.loss .t-ico svg{stroke:var(--red);}

  /* ---------- api key panel ---------- */
  .apibox{
    display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);
  }
  .apibox.on{background:#f4fbf9;border-color:#cfe9e2;box-shadow:none;}
  .apibox.off{background:#fff8f4;border-color:#ffd9c9;}
  .apibox > div{flex:1;min-width:0;}
  .apibox .ab-t{font-size:13px;font-weight:700;color:#242c38;letter-spacing:-.3px;}
  .apibox .ab-s{margin-top:4px;font-size:11.5px;color:var(--sub);letter-spacing:-.2px;line-height:1.6;}
  .apibox button{flex-shrink:0;}

  /* ---------- coupang ranking ---------- */
  .rankno{
    display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;
    background:#f1f3f6;color:#6b7480;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;
  }
  .rankno.top{background:linear-gradient(135deg,#16b89c,#0d6d5d);color:#fff;box-shadow:0 2px 7px rgba(18,165,140,.32);}
  .revcell{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
  .revcell .bar-track{flex:0 0 56px;}

  /* 노출 순위 표 — 넓은 화면에서 칸이 흩어지지 않게 왼쪽으로 모은다 */
  .tbl-rank{table-layout:fixed;min-width:960px;}
  .tbl-rank th,.tbl-rank td{padding-left:14px;padding-right:14px;}
  .tbl-rank th:first-child,.tbl-rank td:first-child{padding-left:18px;}
  .tbl-rank th:nth-last-child(2),.tbl-rank td:nth-last-child(2),
  .tbl-rank th.pad,.tbl-rank td.pad{border-right:none;}
  .tbl-rank thead th{padding-top:12px;padding-bottom:12px;font-size:11px;letter-spacing:.2px;}
  .tbl-rank tbody td{padding-top:11px;padding-bottom:11px;}
  .tbl-rank tbody tr{transition:background .12s ease;}
  .tbl-rank tbody tr:hover{background:var(--teal-l);}
  .tbl-rank tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--teal);}
  .tbl-rank .rankno{width:30px;height:30px;border-radius:9px;font-size:12.5px;}
  .tbl-rank .cell-prod{gap:12px;}
  .tbl-rank .cell-thumb{width:46px;height:46px;flex:0 0 46px;border:1px solid var(--line2);background:#fff;border-radius:10px;}
  .tbl-rank .cell-prod .nm{
    max-width:none;white-space:normal;line-height:1.42;font-size:12.5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tbl-rank .price-cell{font-size:14px;font-weight:800;color:#1b222c;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
  .tbl-rank .rev-cell{font-weight:600;color:#5b6472;font-variant-numeric:tabular-nums;}
  .tbl-rank .rev-cell.thin{color:var(--sub2);font-weight:500;}
  .tbl-rank .sold-cell{font-size:13px;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums;}
  .tbl-rank .rev-money{font-size:13px;font-weight:800;color:#0e8f79;font-variant-numeric:tabular-nums;}
  .tbl-rank .sold-cell.thin,.tbl-rank .rev-money.thin{color:var(--sub2);font-weight:500;font-size:12.5px;}
  .tbl-rank .row-btns{justify-content:flex-start;}
  .est-note{
    padding:10px 17px;background:#fffaeb;border-bottom:1px solid #f4e7c4;
    font-size:11.5px;color:#8a6d29;letter-spacing:-.2px;line-height:1.6;
  }
  .est-note b{font-weight:800;color:#7a5d1a;}
  .tm-tabs{display:flex;gap:6px;background:#f4f6f8;border-radius:10px;padding:4px;}
  .tm-tab{
    border:none;background:transparent;border-radius:8px;padding:7px 14px;cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:700;color:#6b7480;letter-spacing:-.2px;
  }
  .tm-tab:hover{color:#3f4753;}
  .tm-tab.on{background:#fff;color:var(--teal);box-shadow:0 1px 3px rgba(16,24,40,.10);}
  .est-note.ok{background:#e9f9f4;border-bottom-color:#c7ece1;color:#0e7a66;}
  .est-note.ok b{color:#0b6353;}
  .est-note .tiny{padding:3px 8px;font-size:10.5px;margin:0 2px;}
  .est-mark{
    display:inline-block;margin-left:5px;font-style:normal;font-size:9.5px;font-weight:700;
    color:#9a7b3a;background:#fffaeb;border:1px solid #f0e0bd;border-radius:5px;padding:1px 4px;
    vertical-align:1px;
  }
  .tiny.go{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700;}
  .tiny.go:hover{background:var(--teal-d);}
  .tiny.go:disabled{background:#c3d3d0;border-color:#c3d3d0;color:#fff;}

  /* ---------- season banner ---------- */
  .season{
    display:flex;gap:12px;align-items:flex-start;margin:0 16px 16px;padding:13px 15px;
    background:#f2f7ff;border:1px solid #dce8fa;border-radius:12px;
  }
  .season .sc-ico{font-size:15px;line-height:1.4;flex-shrink:0;}
  .season .sc-t{font-size:12.5px;font-weight:600;color:#2c4f85;letter-spacing:-.2px;}
  .season .sc-t b{color:#1f4e9c;font-weight:800;}
  .season .sc-s{margin-top:5px;font-size:11.5px;color:#6b87ad;letter-spacing:-.2px;line-height:1.6;}
  .season .sc-s b{color:#2c4f85;font-weight:700;}
  .season-chip{
    font-size:9.5px;font-weight:800;border-radius:5px;padding:2px 6px;margin-left:7px;
    background:#eef4ff;color:#3b82f6;vertical-align:middle;
  }

  /* ---------- keyword recommendation ---------- */
  .reco{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line2);}
  .reco:last-child{border-bottom:none;}
  .reco .rank{
    flex:0 0 26px;width:26px;height:26px;border-radius:9px;background:#123c34;color:#fff;
    font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .reco .rmain{flex:1;min-width:0;}
  .rtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .rkw{font-size:14.5px;font-weight:800;color:#1b222c;letter-spacing:-.4px;word-break:break-all;}
  .rscore{font-size:17px;font-weight:800;color:#0f7a66;letter-spacing:-.5px;flex-shrink:0;}
  .rscore small{font-size:10.5px;font-weight:600;margin-left:2px;}
  .rscore em{
    font-style:normal;font-size:9.5px;font-weight:700;color:#9a7b3a;background:#fffaeb;
    border:1px solid #fceec4;border-radius:5px;padding:2px 5px;margin-left:7px;vertical-align:middle;
  }
  .rmeta{margin-top:8px;font-size:11.5px;color:var(--sub);letter-spacing:-.2px;}
  .rsay{margin-top:5px;font-size:12px;color:#4f5866;letter-spacing:-.2px;line-height:1.6;}

  .summary{
    padding:4px 18px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:0 32px;border-top:1px solid var(--line2);margin-top:2px;
  }
  .srow{
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    padding:9px 0;border-bottom:1px solid var(--line2);
  }
  .srow .sk{font-size:11.5px;color:var(--sub);letter-spacing:-.2px;}
  .srow .sv{font-size:12.5px;font-weight:700;color:#333c48;letter-spacing:-.3px;}
  .srow.total{grid-column:1/-1;border-bottom:none;padding-top:12px;margin-top:4px;border-top:1.5px solid #dfe4ea;}
  .srow.total .sk{font-size:12.5px;font-weight:700;color:#2a323d;}
  .srow.total .sv{font-size:16px;font-weight:800;color:var(--green);letter-spacing:-.5px;}
  .srow.total .sv.neg{color:var(--red);}
  @media (max-width:900px){ .summary{grid-template-columns:1fr;} }

  .memo{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line2);}
  .memo-label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:#3f4753;flex-shrink:0;}
  .memo input{flex:1;border:none;outline:none;font-size:12.5px;color:#3f4753;background:transparent;letter-spacing:-.2px;min-width:0;}
  .memo input::placeholder{color:#b6bec7;}
  .memo .count{font-size:11px;color:#b6bec7;flex-shrink:0;}

  /* ================= TABLES / LISTS ================= */
  .toolbar{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap;}
  .search{position:relative;flex:1;min-width:180px;max-width:360px;display:flex;}
  .search input{
    width:100%;border:1px solid #e3e7ec;border-radius:9px;padding:9px 12px 9px 32px;font-size:12.5px;
    color:#3f4753;outline:none;letter-spacing:-.2px;background:#fff;
  }
  .search input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(18,165,140,.10);}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:#9aa3ae;stroke-width:1.8;fill:none;stroke-linecap:round;}
  select.sel-box{
    border:1px solid #e3e7ec;border-radius:9px;padding:9px 11px;font-size:12.5px;color:#3f4753;
    background:#fff;outline:none;letter-spacing:-.2px;
  }
  .tbl-wrap{overflow-x:auto;}
  /* 칸이 많은 표는 세로선을 넣어 눈이 줄을 놓치지 않게 한다 */
  table.lined th, table.lined td{border-right:1px solid var(--line2);}
  table.lined th:last-child, table.lined td:last-child{border-right:none;}
  th[data-sort],th[data-kwsort]{cursor:pointer;user-select:none;}
  th[data-sort]:hover,th[data-kwsort]:hover{color:var(--teal);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px;}
  thead th{
    text-align:left;font-size:11px;font-weight:700;color:#8a93a0;letter-spacing:-.2px;
    padding:11px 16px;border-bottom:1px solid var(--line2);white-space:nowrap;background:#fcfdfd;
  }
  tbody td{padding:12px 16px;border-bottom:1px solid var(--line2);color:#3f4753;letter-spacing:-.2px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fbfcfd;}
  td.r,th.r{text-align:right;}
  td.c,th.c{text-align:center;}
  .cell-prod{display:flex;align-items:center;gap:11px;min-width:0;}
  .cell-thumb{width:40px;height:40px;flex:0 0 40px;border-radius:9px;background:#f5f6f8;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .cell-thumb img{width:100%;height:100%;object-fit:cover;}
  .cell-thumb.noimg{background:#f1f3f6;}
  .cell-prod .nm{font-weight:700;color:#242c38;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px;}
  .cell-prod .sm{font-size:10.5px;color:var(--sub2);margin-top:3px;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:20px;padding:4px 9px;letter-spacing:-.2px;}
  .pill.good{background:#e9f9ef;color:#128c4a;}
  .pill.mid{background:#fffaeb;color:#9a7b3a;}
  .pill.bad{background:#fff1f1;color:#c53236;}
  .pill.gray{background:#f1f3f6;color:#6b7480;}
  .row-btns{display:flex;gap:6px;justify-content:flex-end;}
  .tiny{
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600;color:#5b6472;background:#fff;
  }
  .tiny:hover{background:#f7f9fa;}
  .tiny.danger{color:var(--red);border-color:#f6d5d6;}
  .empty-state{padding:52px 20px;text-align:center;}
  .empty-state .ic{font-size:26px;}
  .empty-state h4{margin:12px 0 0;font-size:14px;font-weight:700;color:#3f4753;letter-spacing:-.3px;}
  .empty-state p{margin:7px 0 0;font-size:12px;color:var(--sub);letter-spacing:-.2px;line-height:1.6;}
  .empty-state button{margin-top:16px;}

  /* ================= DASH ================= */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 17px;box-shadow:var(--shadow);}
  .kpi .k{font-size:11.5px;color:var(--sub);letter-spacing:-.2px;}
  .kpi .v{margin-top:8px;font-size:24px;font-weight:800;letter-spacing:-.8px;color:#1b222c;}
  .kpi .s{margin-top:6px;font-size:10.5px;color:var(--sub2);letter-spacing:-.2px;}
  .kpi.hero{background:linear-gradient(135deg,#14352e,#123c34);border:none;}
  .kpi.hero .k{color:#8fb8ad;} .kpi.hero .v{color:#fff;} .kpi.hero .s{color:#6f9d92;}
  .sec-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line2);}
  .sec-head h3{margin:0;font-size:14px;font-weight:800;letter-spacing:-.35px;color:#1b222c;}
  .sec-head a{font-size:12px;color:var(--teal);font-weight:700;text-decoration:none;}
  .bars{padding:17px;display:flex;flex-direction:column;gap:13px;}
  .bar-row{display:grid;grid-template-columns:minmax(0,150px) 1fr auto;gap:12px;align-items:center;}
  .bar-row .lb{font-size:12px;color:#4f5866;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{height:9px;border-radius:20px;background:#f0f2f5;overflow:hidden;}
  .bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#1cb894,#0f9c86);}
  .bar-fill.warn{background:linear-gradient(90deg,#f7b955,#f5a524);}
  .bar-fill.bad{background:linear-gradient(90deg,#f08a8d,#e5484d);}
  .bar-row .vl{font-size:12px;font-weight:800;color:#242c38;letter-spacing:-.3px;}

  /* ================= GUIDE ================= */
  .guide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start;}
  .gd{padding:22px 24px;}
  .gd h3{margin:0 0 4px;font-size:15px;font-weight:800;letter-spacing:-.4px;color:#1b222c;}
  .gd .lead{margin:0 0 18px;font-size:12px;color:var(--sub);letter-spacing:-.2px;line-height:1.6;}
  .steps{display:flex;flex-direction:column;gap:16px;counter-reset:s;}
  .step{display:flex;gap:13px;}
  .step .n{
    flex:0 0 24px;width:24px;height:24px;border-radius:8px;background:#123c34;color:#fff;
    font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  }
  .step h4{margin:2px 0 0;font-size:12.5px;font-weight:700;color:#2a323d;letter-spacing:-.3px;}
  .step p{margin:6px 0 0;font-size:11.5px;color:#6b7480;line-height:1.65;letter-spacing:-.2px;}
  code.k{
    background:#f1f3f6;border:1px solid var(--line);border-radius:5px;padding:1px 5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;color:#3f4753;
  }
  .ri-modal{max-width:680px!important;}
  .ri-wait{display:flex;align-items:center;gap:10px;padding:26px 4px;font-size:13px;color:var(--sub);}
  .ri-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 1.6fr;gap:8px;align-items:stretch;}
  .ri-kpi{background:#f7f9fa;border:1px solid var(--line2);border-radius:10px;padding:9px 10px;}
  .ri-kpi b{display:block;font-size:17px;font-weight:800;color:#1b222c;letter-spacing:-.4px;}
  .ri-kpi span{font-size:10.5px;color:var(--sub);}
  .ri-dist{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:4px 2px;}
  .ri-bar{display:grid;grid-template-columns:26px 1fr 34px;align-items:center;gap:6px;font-size:10px;color:var(--sub);}
  .ri-bar i{height:6px;background:#eef1f4;border-radius:4px;overflow:hidden;display:block;}
  .ri-bar i b{display:block;height:100%;background:var(--amber);}
  .ri-bar em{font-style:normal;text-align:right;}
  .ri-sum{margin-top:12px;background:#f4faf8;border:1px solid #d5eee6;border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.65;color:#1f4f45;}
  .ri-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .ri-col h4{margin:0 0 7px;font-size:12.5px;font-weight:800;}
  .ri-col h4.good{color:#12805f;} .ri-col h4.bad{color:#c53236;}
  .ri-item{border:1px solid var(--line2);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:#fff;}

<script>
(function(){
"use strict";

/* =======================================================================
   0. utils
   ======================================================================= */
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var esc = function(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
var nf = function(n){ return Math.round(Number(n)||0).toLocaleString('ko-KR'); };
var won = function(n){ return nf(n)+'원'; };
/* 매출처럼 큰 돈은 만 단위로 줄여 읽기 쉽게 보여준다 */
var manwon = function(n){
  var v = Math.round(Number(n)||0);
  if(!v) return '-';
  if(v >= 100000000) return (Math.round(v/10000000)/10).toLocaleString('ko-KR')+'억';
  if(v >= 10000) return Math.round(v/10000).toLocaleString('ko-KR')+'만';
  return nf(v);
};
var num = function(v){
  var x = parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));
  return isFinite(x) ? x : 0;
};
var nowIso = function(){ return new Date().toISOString(); };
var fmtDate = function(iso){
  if(!iso) return '-';
  var d = new Date(iso);
  if(isNaN(d)) return '-';
  var p = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
};
var rid = function(p){
  return (p||'r') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
};
var debounce = function(fn,ms){
  var t; return function(){ var a=arguments,s=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(s,a); },ms); };
};
/* 누르자마자 눈에 보이게 바꾼다. 뒤에 오는 작업이 길어도 눌린 것은 바로 안다. */
function pressBtn(el, label){
  if(!el) return;
  el.classList.add('pressing');
  el.disabled = true;
  el.innerHTML = '<span class="spin"></span>' + esc(label);
}
function toast(msg,kind){
  var box = $('#toasts');
  var el = document.createElement('div');
  el.className = 'toast ' + (kind==='err'?'err':'ok');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function(){ el.remove(); }, kind==='err'?5200:3000);
}
function safeLocal(fn,dflt){
  try { return fn(); } catch(e){ return dflt; }
}

/* placeholder illustration — same earbud drawing as the original mock */
function phSvg(tone){
  var fill = tone==='dark' ? '#2b3138' : '#ffffff';
  var line = tone==='dark' ? '#454c55' : '#cdd4db';
  return '<svg viewBox="0 0 120 120" width="70%" height="70%" aria-hidden="true">'+

    '<path d="M62 26c6 0 11 5 11 12 0 6-4 10-9 10s-9-4-9-10c0-7 1-12 7-12z"/>'+

/* 그림 주소가 이 화면에서 안 열리는 것이면, 깨진 아이콘 대신 빈 칸을 보여준다.
   쿠팡과 1688 의 그림 서버는 바깥에서 부르면 막는다. 수집기를 거친 것만 뜬다. */
function showableImg(src){
  var t = String(src || '');
  if(!t) return '';
  if(t.indexOf('data:') === 0) return t;
  if(t.indexOf('blob:') === 0) return t;
  if(/^https?:\/\/[^/]*(coupangcdn|alicdn|aliimg|kwcdn|taobao|tmall)\./i.test(t)) return '';
  return t;
}

function imgOr(src,tone){
  var ok = showableImg(src);
  return ok ? '<img src="'+esc(ok)+'" alt="" loading="lazy" '+
    'onerror="this.style.display=\'none\';this.parentNode.classList.add(\'noimg\');">'
    : phSvg(tone);
}

/* =======================================================================
   1. store — artifact db, with a localStorage fallback
   ======================================================================= */
var Store = {
  db:null, mode:'local', ready:false,
  async init(){
    var db = null;
    try { db = await window.claude.use('db'); } catch(e){ db = null; }
    this.db = db;
    this.mode = db ? 'db' : 'local';
    this.ready = true;
    return this.mode;
  },
  _lk(path){ return 'sp.local.'+path; },
  async get(path){
    if(this.db){
      var s = await this.db.doc(path).get();
      return s.exists ? Object.assign({}, s.data()) : null;
    }
    return safeLocal(function(){
      var v = localStorage.getItem(Store._lk(path));
      return v ? JSON.parse(v) : null;
    }, null);
  },
  async set(path,data){
    if(this.db) return this.db.doc(path).set(data);
    var self = this;
    return safeLocal(function(){
      localStorage.setItem(self._lk(path), JSON.stringify(data));
      var col = path.slice(0, path.lastIndexOf('/'));
      var id = path.slice(path.lastIndexOf('/')+1);
      var idxKey = 'sp.idx.'+col;
      var idx = JSON.parse(localStorage.getItem(idxKey)||'[]');
      if(idx.indexOf(id)<0){ idx.push(id); localStorage.setItem(idxKey, JSON.stringify(idx)); }
    });
  },
  async del(path){
    if(this.db) return this.db.doc(path).delete();
    var self = this;
    return safeLocal(function(){
      localStorage.removeItem(self._lk(path));
      var col = path.slice(0, path.lastIndexOf('/'));
      var id = path.slice(path.lastIndexOf('/')+1);
      var idxKey = 'sp.idx.'+col;
      var idx = JSON.parse(localStorage.getItem(idxKey)||'[]').filter(function(x){ return x!==id; });
      localStorage.setItem(idxKey, JSON.stringify(idx));
    });
  },
  async list(col){
    if(this.db){
      var snap = await this.db.collection(col).limit(1000).get();
      return snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
    }
    var self = this;
    return safeLocal(function(){
      var idx = JSON.parse(localStorage.getItem('sp.idx.'+col)||'[]');
      return idx.map(function(id){
        var v = localStorage.getItem(self._lk(col+'/'+id));
        return v ? Object.assign({_id:id}, JSON.parse(v)) : null;
      }).filter(Boolean);
    }, []);
  }
};

/* asset uploads keep thumbnails out of the 256KB document budget */
var INLINE_IMG_MAX = 20000;
function dataUrlToBlob(dataUrl){
  var parts = String(dataUrl).split(',');
  var mime = (parts[0].match(/data:([^;]+)/) || [,'image/jpeg'])[1];
  var bin = atob(parts[1] || '');
  var arr = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
var Assets = {
  ns:null, tried:false,
  async get(){
    if(this.tried) return this.ns;
    this.tried = true;
    try { this.ns = await window.claude.use('assets'); } catch(e){ this.ns = null; }
    return this.ns;
  },
  async store(dataUrl){
    if(!dataUrl || dataUrl.indexOf('data:')!==0) return dataUrl||'';
    var small = dataUrl.length < INLINE_IMG_MAX ? dataUrl : '';
    var ns = await this.get();
    if(!ns) return small;
    try {
      var up = await ns.upload(dataUrlToBlob(dataUrl));
      return up && up.url ? up.url : small;
    } catch(e){
      return small;
    }
  }
};

      if(d.type === 'hello'){
        var was = self.present;
        self.present = true;
        self.version = d.version || '';
        if(!was && self.onChange) self.onChange();
        return;
      }
      if(d.type === 'result'){
        var w = self.waiters[d.reqId];
        if(w){ delete self.waiters[d.reqId]; w(d); }
        return;
      }
      /* 쿠팡 화면에서 리뷰 정리를 부탁해 온 경우. 이 화면만 언어 모델을 쓸 수 있다. */

        (async function(){
          var out = null;
          try { out = await Sampler.reviewInsight(d.name, d.reviews || []); } catch(e){ out = null; }
          window.postMessage({__sp:'page', type:'analyzeResult', reqId:d.reqId, ok:!!out, data:out,
            error: out ? '' : '리뷰를 문장으로 정리하지 못했습니다.'}, '*');
        })();
      }
    });
    window.postMessage({__sp:'page', type:'ping'}, '*');
    setTimeout(function(){ window.postMessage({__sp:'page', type:'ping'}, '*'); }, 900);
  },
  ask(payload, timeoutMs, timeoutMsg){
    var self = this;
    return new Promise(function(resolve){
      if(!self.present){
        resolve({ok:false, error:'확장프로그램이 연결되지 않았습니다. 이용 가이드에서 설치 방법을 확인하세요.'});
        return;
      }
      var reqId = 'q'+(++self.seq)+'_'+Date.now();
      var done = false;
      self.waiters[reqId] = function(d){
        if(done) return; done = true;
        resolve({ok:!!d.ok, data:d.data, error:d.error, needsKey:!!d.needsKey,
                 assisted:!!d.assisted, blocked:!!d.blocked});
      };
      window.postMessage(Object.assign({__sp:'page', reqId:reqId}, payload), '*');
      setTimeout(function(){
        if(done) return; done = true;
        delete self.waiters[reqId];
        resolve({ok:false, error:timeoutMsg});
      }, timeoutMs);
    });

function cleanUrl(v){

  var i = v.lastIndexOf('http');

/* 환율은 네이버에서 받아온 최신값을 쓴다. 분석마다 고정해 둔 경우에만 그 값을 지킨다. */
function effRate(rec){
  var s = Object.assign({}, DEFAULTS, (rec && rec.settings) || {});
  if(s.rateLocked) return num(s.rate);
  if(App && App.fx && num(App.fx.rate)) return num(App.fx.rate);
  return num(s.rate);
}
function calc(rec){
  var s = Object.assign({}, DEFAULTS, rec.settings||{});
  s.rate = effRate(rec);
  var cand = (rec.candidates||[])[rec.selected||0] || {};
  var sell = num(rec.coupang && rec.coupang.price);
  var qty = num(rec.monthlyQty);
  var cny = num(cand.price);
  var goods = cny * s.rate;                    // 환율 적용 상품가격
  var extra = goods * num(s.multiplier);       // 한국도착까지 모든비용
  var arrival = goods + extra;                 // 한국 도착시 상품 원가
  var fee = sell * (num(s.feeRate)/100);       // 쿠팡 판매 수수료
  var logistics = num(s.logistics);            // 입출고배송비
  var total = arrival + fee + logistics;
  var profit = sell - total;
  var margin = sell ? (profit/sell*100) : 0;
  return {
    s:s, cny:cny, unitKrw:goods, goods:goods, extra:extra, arrival:arrival,
    fee:fee, logistics:logistics, total:total, sell:sell,
    profit:profit, margin:margin, qty:qty, monthly:profit*qty
  };
}
function calcFor(rec, i){
  var clone = Object.assign({}, rec, {selected:i});
  return calc(clone);
}

async function sha256(text){
  if(window.crypto && crypto.subtle){
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.prototype.map.call(new Uint8Array(buf), function(b){
      return ('0'+b.toString(16)).slice(-2);
    }).join('');
  }
  var h = 0, i;
  for(i=0;i<text.length;i++){ h = ((h<<5)-h+text.charCodeAt(i))|0; }
  return 'w'+(h>>>0).toString(16);
}
var Auth = {
  user:null,
  async register(uid, name, pw){
    uid = String(uid||'').trim().toLowerCase();
    if(!/^[a-z0-9_.\-]{3,20}$/.test(uid)) throw new Error('아이디는 영문 소문자, 숫자, _ . - 조합으로 3~20자여야 합니다.');
    if(!name || name.trim().length < 1) throw new Error('이름을 입력해주세요.');
    if(!pw || pw.length < 6) throw new Error('비밀번호는 6자 이상이어야 합니다.');
    var existing = await Store.get('users/'+uid);
    if(existing) throw new Error('이미 사용 중인 아이디입니다.');
    var all = await Store.list('users');
    var salt = rid('s');
    var user = {
      uid: uid, name: name.trim(),
      salt: salt, hash: await sha256(salt+':'+pw),
      role: (all.length === 0 || uid === 'admin') ? 'admin' : 'user',
      disabled: false,
      settings: Object.assign({}, DEFAULTS),
      createdAt: nowIso(), lastLoginAt: nowIso()
    };
    await Store.set('users/'+uid, user);
    this._session(uid);
    this.user = user;
    return user;
  },
  async login(uid, pw){
    uid = String(uid||'').trim().toLowerCase();
    var u = await Store.get('users/'+uid);
    if(!u) throw new Error('아이디 또는 비밀번호가 올바르지 않습니다.');
    if(u.disabled) throw new Error('사용이 중지된 계정입니다. 관리자에게 문의하세요.');
    var h = await sha256(u.salt+':'+pw);
    if(h !== u.hash) throw new Error('아이디 또는 비밀번호가 올바르지 않습니다.');
    u.lastLoginAt = nowIso();
    await Store.set('users/'+uid, u);
    this._session(uid);
    this.user = u;
    return u;
  },
  async resume(){
    var uid = safeLocal(function(){ return localStorage.getItem('sp.session'); }, null);
    if(!uid) return null;
    var u = await Store.get('users/'+uid);
    if(!u || u.disabled){ this.logout(); return null; }
    this.user = u;
    return u;
  },
  _session(uid){ safeLocal(function(){ localStorage.setItem('sp.session', uid); }); },
  logout(){
    this.user = null;
    safeLocal(function(){ localStorage.removeItem('sp.session'); });
  }
};

  App.partner = pr.ok && pr.data ? pr.data : {hasKey:false, left:0};

/* 경쟁은 네이버 검색광고가 주는 값만으로 본다. 네이버쇼핑 페이지는 열지 않는다. */
function adScore(comp){
  if(/낮음/.test(comp||'')) return 1;
  if(/중간/.test(comp||'')) return 0.6;
  if(/높음/.test(comp||'')) return 0.3;
  return null;
}
/* 한 검색어에 평균 몇 개의 광고가 붙는지. 많을수록 이미 돈이 몰린 자리다. */
function depthScore(row){
  var d = num(row && row.depth);
  if(!d) return null;
  return Math.max(0, Math.min(1, 1 - (d - 1) / 14));
}
/* 0~1 로 본 빈자리 정도. 클수록 비어 있다. */
function kwCompete(row){
  var ad = adScore(row && row.comp);
  var ds = depthScore(row);
  if(ad === null && ds === null) return null;
  if(ds === null) return ad;
  if(ad === null) return ds;
  return 0.6*ad + 0.4*ds;
}
function kwGrade(row){
  var c = kwCompete(row);
  if(c === null) return {cls:'gray', text:'미확인'};
  if(c >= 0.8) return {cls:'good', text:'매우 좋음'};
  if(c >= 0.6) return {cls:'good', text:'좋음'};
  if(c >= 0.4) return {cls:'mid',  text:'보통'};
  return {cls:'bad', text:'과열'};
}
/* 점수 = 수요 45 + 광고 경쟁 45 + 모바일 비중 10 */
function kwScore(row){
  /* 월 100회면 0점, 월 10만회면 만점 */
  var demand = Math.max(0, Math.min(1, (Math.log10((row.total||0)+1) - 2) / 3));
  var c = kwCompete(row);
  var mob = row.total ? (row.mobile/row.total) : 0;
  return {
    score: Math.round(100*(0.45*demand + 0.45*(c === null ? 0.6 : c) + 0.1*mob)),
    estimated: c === null
  };
}
function kwReason(row){
  var parts = ['월 검색 '+nf(row.total)+'회'];
  if(row.comp) parts.push('광고 경쟁 '+row.comp);
  if(num(row.depth)) parts.push('붙은 광고 '+num(row.depth).toFixed(1)+'개');
  if(row.total && row.mobile/row.total > 0.75) parts.push('모바일 검색이 대부분');
  return parts.join(' · ');
}
function kwVerdict(row){
  var c = kwCompete(row);
  if(c === null) return '광고 경쟁 정보가 없어 검색량만 보고 매긴 점수입니다.';
  if(c >= 0.8) return '검색은 있는데 광고가 거의 붙지 않았습니다. 지금 들어갈 만합니다.';
  if(c >= 0.6) return '광고 경쟁이 낮은 편입니다. 상세페이지로 승부해볼 만합니다.';
  if(c >= 0.4) return '평범한 경쟁입니다. 가격이나 구성으로 차별점이 필요합니다.';
  return '이미 광고가 빽빽합니다. 후발주자로는 광고비가 많이 듭니다.';
}
/* 머리글을 눌렀을 때 그 칸의 값을 꺼내는 규칙.
   글자는 글자끼리, 숫자는 숫자끼리 견준다. 값이 없는 줄은 늘 뒤로 보낸다. */
var KW_COLS = {
  keyword: function(r){ return String(r.keyword || ''); },
  total:   function(r){ return num(r.total); },
  pc:      function(r){ return num(r.pc); },
  mobile:  function(r){ return num(r.mobile); },
  comp:    function(r){
    if(/낮음/.test(r.comp||'')) return 1;
    if(/중간/.test(r.comp||'')) return 2;
    if(/높음/.test(r.comp||'')) return 3;
    return null;
  },
  depth:   function(r){ return num(r.depth) || null; },
  grade:   function(r){ return kwCompete(r); },
  score:   function(r){ return kwScore(r).score; }
};
function kwSortRows(rows, col, dir){
  var get = KW_COLS[col];
  if(!get) return rows;
  return rows.sort(function(a,b){
    var x = get(a), y = get(b);
    var xn = (x === null || x === undefined || x === '');
    var yn = (y === null || y === undefined || y === '');
    if(xn && yn) return 0;
    if(xn) return 1;        /* 값 없는 줄은 방향과 상관없이 뒤로 */
    if(yn) return -1;
    if(typeof x === 'string') return dir * x.localeCompare(y, 'ko');
    return dir * (x - y);
  });
}

/* 누를 수 있는 머리글 한 칸. 지금 정렬 중인 칸에는 화살표를 붙인다. */
function kwHead(col, label, cls){
  var on = App.kw.col === col;
  var arrow = on ? (App.kw.dir < 0 ? ' ▼' : ' ▲') : '';
  return '<th'+(cls ? ' class="'+cls+'"' : '')+
    ' data-kwsort="'+col+'"'+
    ' style="cursor:pointer;'+(on ? 'color:var(--teal);' : '')+'"'+
    ' title="눌러서 정렬">'+esc(label)+arrow+'</th>';
}

function kwExcluded(keyword){
  var words = String(App.kw.exclude||'').split(/[,\s]+/).map(function(w){ return w.trim(); }).filter(Boolean);
  if(!words.length) return false;
  return words.some(function(w){ return keyword.indexOf(w) >= 0; });
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

async function loadFx(){
  try {

    if(doc && num(doc.rate)) App.fx = doc;

async function refreshFx(force, silent){
  App.busy.fx = true;
  var res = await Ext.rate(force);

  if(!res.ok || !res.data || !num(res.data.rate)){
    if(!silent) toast(res.error || '환율 값을 읽지 못했습니다.','err');
    return false;
  }
  var d = res.data;
  App.fx = {
    rate: num(d.rate),
    label: d.label || '고시 환율',
    base: num(d.base),
    send: num(d.send),
    source: d.source || '네이버 금융',
    fetchedAt: nowIso(),
    by: Auth.user ? Auth.user.uid : ''
  };
  try { await Store.set('config/fx', App.fx); } catch(e){ /* 공용 저장 실패는 화면 표시에 영향 없음 */ }
  return true;
}
function fxCaption(){
  if(!App.fx) return '적용 환율';
  var t = new Date(App.fx.fetchedAt);
  var hh = isNaN(t) ? '' : (' · '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2));
  return App.fx.source + ' ' + App.fx.label + hh;
}

function viewDash(){

  var avgMargin = withCalc.length
    ? withCalc.reduce(function(s,x){ return s + x.c.margin; },0) / withCalc.length : 0;
  var monthlySum = withCalc.reduce(function(s,x){ return s + Math.max(0, x.c.monthly); },0);

    '</div>'+

  '<div class="kpis">'+
    '<div class="kpi"><div class="k">저장된 비교 분석</div><div class="v num">'+nf(recs.length)+'</div>'+

    '<div class="kpi"><div class="k">평균 이익률</div><div class="v num">'+(withCalc.length?avgMargin.toFixed(1)+'%':'-')+'</div>'+
      '<div class="s">이익이 나는 기록 '+nf(profitable)+'건</div></div>'+
    '<div class="kpi"><div class="k">월 예상 이익 합계</div><div class="v num">'+won(monthlySum)+'</div>'+
      '<div class="s">각 기록의 월 판매량 기준</div></div>'+

      '<div class="v num">'+(best.length ? best[0].c.margin.toFixed(1)+'%' : '-')+'</div>'+
      '<div class="s">'+(best.length ? esc((best[0].r.coupang.name || best[0].r.title).slice(0,26)) : '아직 기록이 없습니다')+'</div></div>'+
  '</div>';

  var rows = best.slice(0,6);
  var maxM = rows.length ? Math.max(1, rows[0].c.margin) : 1;
  var chart =
  '<div class="card">'+
    '<div class="sec-head"><h3>이익률 순위</h3><a href="#/list" data-nav="list">보관함 전체 보기</a></div>'+
    (rows.length
      ? '<div class="bars">'+rows.map(function(x){
          var pct = Math.max(2, Math.min(100, x.c.margin / maxM * 100));
          var cls = x.c.margin >= 30 ? '' : (x.c.margin >= 10 ? 'warn' : 'bad');
          return '<div class="bar-row">'+
            '<span class="lb">'+esc(x.r.coupang.name || x.r.title)+'</span>'+
            '<span class="bar-track"><span class="bar-fill '+cls+'" style="width:'+pct.toFixed(1)+'%"></span></span>'+

function seasonBanner(){
  var s = seasonSentence();
  return ''+
  '<div class="season">'+
    '<span class="sc-ico">🗓</span>'+
    '<div>'+
      '<div class="sc-t">오늘 '+esc(s.today)+' 기준 · 지금 주문하면 <b>'+esc(s.arrive)+'</b> 도착</div>'+
      '<div class="sc-s">도착 후 파는 달은 '+esc(s.months)+' 입니다. <b>'+esc(s.names)+'</b> 상품을 우선하고, 철 지난 키워드는 목록에서 뺍니다.</div>'+
    '</div>'+
  '</div>';

function viewKeywords(){
  var k = App.kw;
  var offSeason = 0;
  var rows = k.rows.filter(function(r){
    if(kwExcluded(r.keyword)) return false;
    if(k.season && !seasonFits(r.keyword).fit){ offSeason++; return false; }
    return true;
  });
  if(k.col){
    kwSortRows(rows, k.col, k.dir);
  } else if(k.sort === 'score'){
    rows.sort(function(a,b){ return kwScore(b).score - kwScore(a).score; });
  } else if(k.sort === 'ratio'){
    rows.sort(function(a,b){
      var ca = kwCompete(a), cb = kwCompete(b);
      if(ca === null && cb === null) return b.total - a.total;
      if(ca === null) return 1;
      if(cb === null) return -1;
      return cb - ca;
    });
  } else if(k.sort === 'mobile'){
    rows.sort(function(a,b){ return b.mobile - a.mobile; });
  } else {
    rows.sort(function(a,b){ return b.total - a.total; });
  }

  var head =
  '<div class="page-head">'+
    '<div><h2>키워드 발굴</h2>'+
      '<p>분야를 한 단어로 넣으면 연관 키워드를 모아 수요와 경쟁을 따져 순위를 매겨드립니다.</p></div>'+
    '<div class="actions">'+
      (k.rows.length ? '<button class="act" id="kwClear"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>결과 비우기</button>' : '')+
    '</div>'+
  '</div>';

  var searchBar =
  (App.apiKey === true ? '' : '<div style="margin-bottom:18px;">'+apiKeyPanel()+'</div>')+
  '<div class="card" style="margin-bottom:18px;">'+
    '<div class="toolbar">'+
      '<span class="search" style="max-width:none;">'+
        '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'+
        '<input id="kwSeed" value="'+esc(k.seed)+'" placeholder="예: 주방용품, 캠핑, 블루투스이어폰">'+
      '</span>'+
      '<button class="act primary" id="kwReco"'+(App.busy.kw?' disabled':'')+'>'+
        (App.busy.kw ? '분석 중'
          : '<svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.6L20 10l-4.5 3.8L16.8 20 12 16.9 7.2 20l1.3-6.2L4 10l5.8-1.4z"/></svg>추천 키워드 뽑기')+'</button>'+
      '<button class="act" id="kwAuto"'+(App.busy.kw?' disabled':'')+'>'+
        '<svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 14h6v6h-6z"/><path d="M14 4h6v6h-6zM4 14h6v6H4z"/></svg>알아서 골라줘</button>'+
      '<button class="act" id="kwGo"'+(App.busy.kw?' disabled':'')+'>검색량만 조회</button>'+
      (k.rows.length
        ? '<select class="sel-box" id="kwSort" style="margin-left:auto;">'+
            '<option value="score"'+(k.sort==='score'?' selected':'')+'>추천 점수 순</option>'+
            '<option value="total"'+(k.sort==='total'?' selected':'')+'>검색량 많은 순</option>'+
            '<option value="mobile"'+(k.sort==='mobile'?' selected':'')+'>모바일 검색량 순</option>'+
            '<option value="ratio"'+(k.sort==='ratio'?' selected':'')+'>경쟁 낮은 순</option>'+
          '</select>'
        : '')+
    '</div>'+
    '<div class="toolbar" style="border-bottom:none;padding-top:0;">'+
      '<span class="search" style="max-width:280px;">'+
        '<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>'+
        '<input id="kwExclude" value="'+esc(k.exclude)+'" placeholder="제외할 단어 (예: 삼성, 애플)">'+
      '</span>'+
      '<label class="chk"><input type="checkbox" id="kwSeason"'+(k.season?' checked':'')+'>시즌 필터</label>'+
      '<select class="sel-box" id="kwLead">'+
        [4,6,8,10].map(function(w){
          return '<option value="'+w+'"'+(num(k.leadWeeks)===w?' selected':'')+'>소싱 리드타임 '+w+'주</option>';
        }).join('')+
      '</select>'+
      (offSeason ? '<span class="pill gray">철 지난 키워드 '+nf(offSeason)+'개 숨김</span>' : '')+
    '</div>'+
    (k.season ? seasonBanner() : '')+
    (k.error ? '<div style="padding:14px 16px;color:var(--red);font-size:12px;line-height:1.6;">'+esc(k.error)+'</div>' : '')+
  '</div>';

  var reco = '';
  if(k.scored && rows.length){
    var top = rows.slice().sort(function(a,b){ return kwScore(b).score - kwScore(a).score; }).slice(0,5);
    reco =
    '<div class="card" style="margin-bottom:18px;">'+
      '<div class="sec-head"><h3>추천 키워드</h3>'+
        '<span style="font-size:11.5px;color:var(--sub2);">수요 45 · 광고 경쟁 45 · 모바일 비중 10 으로 매긴 점수입니다</span></div>'+
      '<div class="bars">'+top.map(function(row,i){
        var sc = kwScore(row);
        return '<div class="reco">'+
          '<span class="rank">'+(i+1)+'</span>'+
          '<div class="rmain">'+
            '<div class="rtop">'+
              '<span class="rkw">'+esc(row.keyword)+
                (seasonOfKeyword(row.keyword).length
                  ? '<span class="season-chip">'+esc(SEASON_LABEL[seasonOfKeyword(row.keyword)[0]])+' 상품</span>'
                  : '')+'</span>'+
              '<span class="rscore num">'+sc.score+'<small>점</small>'+
                (sc.estimated ? '<em>추정</em>' : '')+'</span>'+
            '</div>'+
            '<span class="bar-track" style="margin-top:8px;"><span class="bar-fill'+
              (sc.score>=60?'':(sc.score>=40?' warn':' bad'))+'" style="width:'+Math.max(3,sc.score)+'%"></span></span>'+
            '<div class="rmeta num">'+esc(kwReason(row))+'</div>'+
            '<div class="rsay">'+esc(kwVerdict(row))+'</div>'+
          '</div>'+
          '<div class="row-btns" style="flex-shrink:0;flex-direction:column;align-items:stretch;">'+
            '<button class="tiny" data-rank="'+esc(row.keyword)+'"'+
              (App.busy['rank_'+row.keyword]?' disabled':'')+'>'+
              (App.busy['rank_'+row.keyword] ? '수집 중' : '쿠팡 노출 20위 보기')+'</button>'+
            '<button class="tiny" data-top="'+esc(row.keyword)+'"'+(App.busy['top_'+row.keyword]?' disabled':'')+'>'+
              (App.busy['top_'+row.keyword] ? '가져오는 중' : '1위로 바로 비교')+'</button>'+
          '</div>'+
        '</div>';
      }).join('')+'</div>'+
    '</div>';
  }

  var body;
  if(!k.rows.length){
    body =
    '<div class="card"><div class="empty-state">'+
      '<div class="ic">🔎</div>'+
      '<h4>'+(k.ran ? '결과가 없습니다' : '무엇을 팔지 정하지 않으셨어도 됩니다')+'</h4>'+
      '<p>'+(k.ran
        ? '다른 단어로 다시 시도해보세요. 띄어쓰기 없이 붙여 쓰면 결과가 더 잘 나옵니다.'
        : '<b>알아서 골라줘</b>를 누르면 중국 소싱에 잘 맞는 분야 중 몇 개를 무작위로 골라 시작합니다.<br>'+
          '거기서 연관 키워드를 모으고 검색량과 광고 경쟁을 따져 순위를 매겨드립니다.<br><br>'+
          '검색광고 API 키는 확장프로그램 아이콘 → 검색광고 API 키 설정에서 등록합니다.')+'</p>'+
      (k.ran ? '' : '<button class="act primary" id="kwAuto2" style="margin:18px auto 0;">알아서 골라줘</button>')+
    '</div></div>';
  } else {
    body =
    '<div class="card">'+
      '<div class="sec-head"><h3>연관 키워드 '+nf(rows.length)+'개</h3>'+
        '<span style="font-size:11.5px;color:var(--sub2);">판정은 네이버 검색광고의 광고 경쟁도와 붙은 광고 수로 매깁니다</span></div>'+
      '<div class="tbl-wrap"><table class="lined">'+
        '<thead><tr>'+
          kwHead('keyword','키워드','')+
          kwHead('total','월간 검색량','r')+
          kwHead('pc','PC','r')+
          kwHead('mobile','모바일','r')+
          kwHead('comp','광고 경쟁','r')+
          kwHead('depth','붙은 광고','r')+
          kwHead('grade','판정','')+
          '<th></th>'+
        '</tr></thead>'+
        '<tbody>'+rows.map(function(row){
          var g = kwGrade(row);
          var busyTop = App.busy['top_'+row.keyword];
          return '<tr>'+
            '<td style="font-weight:700;color:#242c38;">'+esc(row.keyword)+
              (row.low ? ' <span class="pill gray">10 미만</span>' : '')+'</td>'+
            '<td class="r num" style="font-weight:700;">'+nf(row.total)+'</td>'+
            '<td class="r num" style="color:var(--sub);">'+nf(row.pc)+'</td>'+
            '<td class="r num" style="color:var(--sub);">'+nf(row.mobile)+'</td>'+
            '<td class="r">'+(row.comp ? '<span class="pill gray">'+esc(row.comp)+'</span>' : '-')+'</td>'+
            '<td class="r num">'+(num(row.depth) ? num(row.depth).toFixed(1) : '-')+'</td>'+
            '<td><span class="pill '+g.cls+'">'+g.text+'</span></td>'+
            '<td><div class="row-btns">'+
              '<button class="tiny" data-rank="'+esc(row.keyword)+'"'+
                (App.busy['rank_'+row.keyword]?' disabled':'')+'>'+
                (App.busy['rank_'+row.keyword] ? '수집 중' : '쿠팡 20위')+'</button>'+
              '<button class="tiny" data-top="'+esc(row.keyword)+'"'+(busyTop?' disabled':'')+'>'+
                (busyTop ? '가져오는 중' : '비교 분석')+'</button>'+
            '</div></td>'+
          '</tr>';
        }).join('')+'</tbody>'+
      '</table></div>'+
      '<div style="padding:13px 16px;border-top:1px solid var(--line2);font-size:11px;color:var(--sub2);line-height:1.6;">'+
        '네이버쇼핑 페이지는 열지 않습니다. 검색광고 API 가 준 값만 써서 네이버 접속이 막히지 않습니다.'+
      '</div>'+
    '</div>';
  }

  return head + searchBar + reco + body;
}

/* 결과 키워드에 철이 드러나는 말이 섞이면 그 철의 상품으로 본다 */
var SEASON_WORDS = {
  summer:['여름','하절기','선풍기','냉풍기','서큘레이터','쿨','냉감','아이스','제빙','모기','벌레',
          '제습','수영','물놀이','튜브','해변','비치','자외선','썬','양산','우비','장화','레인','장마','에어컨'],
  winter:['겨울','동절기','난방','히터','난로','온열','발열','전기장판','온수매트','목도리','장갑','귀마개',
          '방한','한파','가습','핫팩','극세사','담요','기모','패딩','스키','보드','제설','성에','눈삽'],
  spring:['봄','춘절기','황사','미세먼지','꽃가루','벚꽃','나들이','소풍','원예','모종','씨앗'],
  fall:  ['가을','추절기','단풍','환절기','추석','할로윈','수확']
};
var SEASON_LABEL = {spring:'봄', summer:'여름', fall:'가을', winter:'겨울'};

function seasonOfMonth(m){
  if(m >= 3 && m <= 5) return 'spring';
  if(m >= 6 && m <= 8) return 'summer';
  if(m >= 9 && m <= 11) return 'fall';
  return 'winter';
}
/* 지금 주문하면 언제 도착하고, 도착 후 어느 철에 팔게 되는지 */
function seasonWindow(){
  var lead = num(App.kw.leadWeeks) || 6;
  var arrive = new Date();
  arrive.setDate(arrive.getDate() + lead * 7);
  var months = [];
  var seasons = {};
  for(var i = 0; i < 3; i++){
    var d = new Date(arrive.getFullYear(), arrive.getMonth() + i, 1);
    var m = d.getMonth() + 1;
    months.push(m);
    seasons[seasonOfMonth(m)] = true;
  }
  return {lead:lead, arrive:arrive, months:months, seasons:Object.keys(seasons)};
}
/* 키워드에서 철을 읽는다. 아무 말도 안 걸리면 연중 상품으로 본다. */
function seasonOfKeyword(keyword){
  var kwd = String(keyword||'');
  var hits = [];
  Object.keys(SEASON_WORDS).forEach(function(season){
    if(SEASON_WORDS[season].some(function(w){ return kwd.indexOf(w) >= 0; })) hits.push(season);
  });
  return hits;
}
function seasonFits(keyword){
  var hits = seasonOfKeyword(keyword);
  if(!hits.length) return {fit:true, season:''};
  var win = seasonWindow();
  var ok = hits.some(function(s){ return win.seasons.indexOf(s) >= 0; });
  return {fit:ok, season:hits[0]};
}
function seedFits(entry){
  if(entry.s === 'all') return true;
  var win = seasonWindow();
  return entry.s.split(',').some(function(s){ return win.seasons.indexOf(s) >= 0; });
}
function seasonSentence(){
  var w = seasonWindow();
  var p = function(n){ return (n<10?'0':'')+n; };
  var today = new Date();
  var arriveTxt = (w.arrive.getMonth()+1) + '월 ' +
    (w.arrive.getDate() <= 10 ? '상순' : (w.arrive.getDate() <= 20 ? '중순' : '하순'));
  var names = w.seasons.map(function(s){ return SEASON_LABEL[s]; }).join('·');
  return {
    today: today.getFullYear()+'.'+p(today.getMonth()+1)+'.'+p(today.getDate()),
    arrive: arriveTxt,
    months: w.months.join('월, ')+'월',
    names: names,
    lead: w.lead
  };
}

function pickSeeds(n){
  var pool = SEED_POOL.filter(function(e){
    return App.kw.season ? seedFits(e) : true;
  });
  if(!pool.length) pool = SEED_POOL.slice();
  var copy = pool.slice();
  var out = [];
  while(out.length < n && copy.length){
    out.push(copy.splice(Math.floor(Math.random()*copy.length), 1)[0].k);
  }
  return out;
}
async function autoRecommend(){
  var seeds = pickSeeds(3);
  App.kw.seed = seeds.join(', ');
  var el = $('#kwSeed');
  if(el) el.value = App.kw.seed;
  var s = seasonSentence();
  toast(App.kw.season
    ? s.names+' 상품 기준으로 '+seeds.join(', ')+' 를 골랐습니다'
    : seeds.join(', ') + ' 로 시작합니다');
  await recommend();
}

async function runKeywords(){
  var seed = $('#kwSeed').value.trim();
  if(!seed){ toast('키워드를 입력해주세요.','err'); return; }
  App.kw.seed = seed;
  App.kw.error = '';
  App.busy.kw = true; render();
  var res = await Ext.keywords(seed);
  App.busy.kw = false;
  App.kw.ran = true;
  App.kw.scored = false;
  if(!res.ok){
    App.kw.rows = [];
    App.kw.error = res.error || '검색량을 가져오지 못했습니다.';
    render();
    if(res.needsKey) toast('확장프로그램 아이콘을 눌러 검색광고 API 키를 먼저 등록해주세요.','err');
    return false;
  }
  App.kw.rows = (res.data && res.data.list) || [];
  render();
  return true;
}

/* 씨앗 하나로 연관 키워드를 받아 검색광고 값만으로 순위를 매긴다.
   네이버쇼핑을 열지 않으므로 네이버가 접속을 막을 일이 없다. */
async function recommend(){
  var seed = $('#kwSeed').value.trim();
  if(!seed){ toast('어떤 분야인지 한 단어만 넣어주세요.','err'); return; }
  var ok = await runKeywords();
  if(!ok || !App.kw.rows.length) return;

  var cands = App.kw.rows.filter(function(r){
    if(r.total < 100) return false;
    if(kwExcluded(r.keyword)) return false;
    if(App.kw.season && !seasonFits(r.keyword).fit) return false;
    return true;
  });
  if(!cands.length){
    toast('조건에 맞는 키워드가 없습니다. 시즌 필터를 끄거나 더 넓은 단어로 시도해보세요.','err');
    return;
  }

  App.kw.scored = true;
  App.kw.sort = 'score';
  render();
  toast('추천 키워드를 뽑았습니다');
}

async function startFromKeyword(keyword){
  App.busy['top_'+keyword] = true;
  Progress.open('쿠팡에서 1위 상품을 가져오는 중입니다',
    '“'+keyword+'” 로 검색해 광고를 뺀 1위 상품으로 비교를 시작합니다.');
  Progress.step('쿠팡 검색 결과를 읽는 중');
  render();

  var res = await Ext.coupangTop(keyword);
  App.busy['top_'+keyword] = false;
  if(!res.ok){
    Progress.close();
    render();
    if(res.blocked){ blockedModal(res.error); return; }
    toast(res.error || '쿠팡 상위 상품을 가져오지 못했습니다.','err');
    return;
  }
  var top = ((res.data && res.data.items) || [])[0];
  if(!top){
    Progress.close();
    render();
    toast('검색 결과에서 상품을 찾지 못했습니다.','err');
    return;
  }

  var rec = blankRecord(Auth.user);
  rec.title = keyword;
  rec.coupang.url = top.url || '';
  rec.coupang.name = top.name || '';
  rec.coupang.price = num(top.price);
  rec.coupang.rating = top.rating || '';
  rec.coupang.reviews = num(top.reviews);
  rec.memo = '키워드 발굴에서 시작 · ' + keyword;
  App.record = rec;
  Progress.close();
  go('compare');
  toast('“'+top.name.slice(0,20)+'” 으로 비교 분석을 시작합니다. 썸네일이 필요하면 수집을 누르세요.');
}

function bindKeywords(){
  var go1 = $('#kwGo');
  if(go1) go1.onclick = runKeywords;
  var rec = $('#kwReco');
  if(rec) rec.onclick = recommend;
  ['#kwAuto','#kwAuto2'].forEach(function(sel){
    var b = $(sel);
    if(b) b.onclick = autoRecommend;
  });
  var seed = $('#kwSeed');
  if(seed){
    seed.addEventListener('input', function(){ App.kw.seed = this.value; });
    seed.addEventListener('keydown', function(e){ if(e.key === 'Enter') recommend(); });
    if(!App.busy.kw){
      seed.focus();
      seed.setSelectionRange(seed.value.length, seed.value.length);
    }
  }
  var exc = $('#kwExclude');
  if(exc){
    exc.addEventListener('input', debounce(function(){
      App.kw.exclude = exc.value;
      render();
      var again = $('#kwExclude');
      if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    }, 320));
  }
  var sort = $('#kwSort');
  if(sort) sort.onchange = function(){
    App.kw.sort = sort.value;
    App.kw.col = '';           /* 고르는 상자를 쓰면 머리글 정렬은 푼다 */
    render();
  };
  $$('[data-kwsort]').forEach(function(th){
    th.onclick = function(){
      var col = th.getAttribute('data-kwsort');
      if(App.kw.col === col){
        App.kw.dir = App.kw.dir < 0 ? 1 : -1;    /* 같은 칸을 또 누르면 방향을 뒤집는다 */
      } else {
        App.kw.col = col;
        App.kw.dir = (col === 'keyword') ? 1 : -1;   /* 글자는 가나다순, 숫자는 큰 것부터 */
      }
      render();
    };
  });
  var season = $('#kwSeason');
  if(season) season.onchange = function(){
    App.kw.season = season.checked;
    render();
    toast(season.checked ? '도착 시점 기준으로 철 지난 키워드를 뺍니다' : '시즌 필터를 껐습니다');
  };
  var lead = $('#kwLead');
  if(lead) lead.onchange = function(){ App.kw.leadWeeks = num(lead.value); render(); };
  var clr = $('#kwClear');
  if(clr) clr.onclick = function(){
    App.kw = Object.assign({}, App.kw, {seed:'', rows:[], sort:'score', ran:false,
      error:'', exclude:'', scored:false, col:'', dir:-1});
    render();
  };
  $$('[data-rank]').forEach(function(b){
    b.onclick = function(){ openRanking(b.getAttribute('data-rank')); };
  });
  $$('[data-top]').forEach(function(b){
    b.onclick = function(){ startFromKeyword(b.getAttribute('data-top')); };
  });
}

   9-d. 자동 소싱
   키워드를 모으고, 쿠팡 상위에서 정한 가격대에 맞는 상품을 고르고,
   그 상품의 썸네일로 1688 후보까지 붙여 보관함에 쌓는다.
   한 건씩 차례로 한다. 몰아서 하면 쿠팡이 접속을 막는다.
   ======================================================================= */
var AUTO_MAX = 30;

/* 브랜드 상품은 1688 에서 같은 물건을 구할 수 없다. 기본으로 뺀다.
   자동 소싱 화면에서 직접 고칠 수 있다. */
var AUTO_BRAND_WORDS = [
  '삼성','갤럭시','애플','아이폰','아이패드','에어팟','맥북','애플워치',
  'LG','엘지','다이슨','발뮤다','쿠쿠','쿠첸','위니아','캐리어',
  '나이키','아디다스','뉴발란스','컨버스','반스','크록스',
  '샤오미','로지텍','앱코','레이저','소니','보스','젠하이저','JBL',
  '필립스','브라운','오랄비','파나소닉','닌텐도','플레이스테이션','엑스박스',
  '스타벅스','락앤락','코렐','휘슬러','테팔','네스프레소','정품','공식'
];

/* 한 키워드에서 몇 개까지 가져갈지. 적게 잡을수록 여러 키워드에 골고루 퍼진다. */
function autoPerKeyword(count){
  return Math.max(1, Math.min(3, Math.ceil(count / 5)));
}

/* 점수 상위권 안에서 순서를 섞는다. 매번 같은 키워드만 나오지 않게 하기 위해서다. */
function shuffle(list){
  var a = list.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 상품명이 그 키워드와 조금이라도 겹치는지 본다.
   쿠팡이 검색 결과 대신 추천 상품을 내주는 일이 있어, 무관한 물건을 걸러낸다.
   두 글자씩 끊어 하나라도 이름에 들어 있으면 관련 있다고 본다. */
function autoRelevant(keyword, name){
  var k = String(keyword || '').replace(/\s+/g, '');
  var n = String(name || '').replace(/\s+/g, '').toLowerCase();
  if(k.length < 2 || !n) return false;
  k = k.toLowerCase();
  for(var i = 0; i < k.length - 1; i++){
    if(n.indexOf(k.slice(i, i + 2)) >= 0) return true;
  }
  return false;
}

function autoExcluded(keyword){
  var raw = App.auto.exclude;
  if(raw === null || raw === undefined) raw = AUTO_BRAND_WORDS.join(' ');
  var words = String(raw).split(/[,\s]+/).map(function(w){ return w.trim(); }).filter(Boolean);
  if(!words.length) return false;
  var kw = String(keyword || '').toLowerCase();
  return words.some(function(w){ return kw.indexOf(w.toLowerCase()) >= 0; });
}

function autoLog(text){
  App.auto.log.unshift({at:new Date(), text:text});
  if(App.auto.log.length > 60) App.auto.log.length = 60;
}

/* 이미 쓴 상품인지 본다. 같은 물건이 여러 키워드에서 겹쳐 나온다. */
function autoSeen(url, name){
  return App.auto.rows.some(function(r){
    return (url && r.url === url) || (name && r.name === name);
  });
