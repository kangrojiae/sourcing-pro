/* 키워드를 모은다. 입력한 분야에 붙는 말을 앞에 두고, 상위권 안에서는 순서를 섞는다. */
async function autoKeywords(seeds){
  var seen = {};
  var out = [];
  var tokens = seeds.map(function(x){ return String(x).toLowerCase(); });
  for(var i = 0; i < seeds.length; i++){
    if(App.auto.stop) break;
    App.auto.step = '“'+seeds[i]+'” 연관 키워드를 모으는 중';
    autoLog('키워드 조회 · '+seeds[i]);
    render();
    var res = await Ext.keywords(seeds[i]);
    if(!res.ok){
      autoLog('키워드 조회 실패 · '+seeds[i]+' · '+(res.error || '이유 불명'));
      if(res.needsKey) autoLog('검색광고 API 키부터 등록해야 합니다');
      continue;
    }
    var got = ((res.data && res.data.list) || []).length;
    var before = out.length;
    ((res.data && res.data.list) || []).forEach(function(k){
      if(seen[k.keyword]) return;
      seen[k.keyword] = true;
      if(num(k.total) < 200) return;
      if(kwExcluded(k.keyword)) return;
      if(autoExcluded(k.keyword)) return;
      if(App.kw.season && !seasonFits(k.keyword).fit) return;
      /* 입력한 분야가 키워드에 들어 있으면 먼저 본다 */
      var low = String(k.keyword).toLowerCase();
      k.near = tokens.some(function(t){ return t && low.indexOf(t) >= 0; }) ? 1 : 0;
      out.push(k);
    });
    autoLog(seeds[i]+' · 연관 '+nf(got)+'개 중 '+nf(out.length - before)+'개 통과');
  }
  /* 붙는 말 먼저, 그다음 점수 순 */
  out.sort(function(a,b){
    if(a.near !== b.near) return b.near - a.near;
    return kwScore(b).score - kwScore(a).score;
  });

  /* 상위권을 넉넉히 남기고 그 안에서 섞는다. 돌릴 때마다 다른 상품이 걸리게 한다. */
  var deep = Math.max(24, App.auto.count * 6);
  var head = shuffle(out.slice(0, deep));
  var near = head.filter(function(k){ return k.near; });
  var rest = head.filter(function(k){ return !k.near; });
  return near.concat(rest, out.slice(deep));
}

/* 한 상품의 1688 후보를 사진과 이름 두 갈래로 찾는다 */
async function autoFind1688(row){
  var pair = await find1688Pair(row.image, row.name, {
    assist: false,                       /* 여러 건을 이어 돌리므로 탭을 남기지 않는다 */
    onStep: function(t){ App.auto.step = t; render(); }
  });
  if(pair.keyword) row.note = '1688 검색어 '+pair.keyword;
  if(pair.noTranslate) autoLog('상품명을 중국어로 바꾸지 못함 · 사진 갈래만 씀 · '+row.keyword);
  if(pair.noThumb) autoLog('썸네일이 없어 사진 검색을 건너뜀 · '+row.keyword);
  else if(pair.imageError) autoLog('사진 검색 실패 · '+row.keyword+' · '+pair.imageError);
  if(pair.how.length) row.note = (row.note ? row.note+' · ' : '') + pair.how.join(', ');
  return merge1688(pair);
}

async function runAuto(){
  var A = App.auto;
  if(A.running) return;
  if(!Ext.present){ toast('확장프로그램이 연결되지 않았습니다.','err'); return; }

  A.count = Math.max(1, Math.min(AUTO_MAX, num($('#autoCount').value) || 10));
  A.lo = num($('#autoLo').value);
  A.hi = num($('#autoHi').value);
  A.seed = $('#autoSeed').value.trim();
  var exEl = $('#autoExclude');
  if(exEl) A.exclude = exEl.value;
  if(A.hi <= A.lo){ toast('판매가 범위를 다시 확인해주세요.','err'); return; }

  A.running = true; A.stop = false; A.ran = true;
  A.rows = []; A.kws = []; A.log = []; A.done = 0; A.step = '시작하는 중';
  render();
  toast('자동 소싱을 시작합니다 · '+A.count+'개, '+nf(A.lo)+'~'+nf(A.hi)+'원');

  /* 검색마다 새 탭을 여닫으면 기계처럼 보인다. 탭 하나로 이어서 본다. */
  await Ext.coupangSession(true);

  try {
    var seeds = A.seed ? A.seed.split(/[,\s]+/).filter(Boolean) : pickSeeds(3);
    autoLog('분야 · '+seeds.join(', '));
    var kws = await autoKeywords(seeds);
    if(!kws.length){
      autoLog('쓸 만한 키워드가 하나도 없습니다');
      autoLog('검색광고 API 키가 등록돼 있는지, 시즌 필터가 너무 좁지 않은지 봐주세요');
      toast('조건에 맞는 키워드가 없습니다. 아래 진행 기록을 확인해주세요.','err');
      return;
    }
    autoLog('키워드 '+nf(kws.length)+'개 확보 · 한 키워드당 최대 '+
            nf(autoPerKeyword(A.count))+'개');
    A.kws = kws.map(function(k){
      return {keyword:k.keyword, total:num(k.total), comp:k.comp || '',
              near:!!k.near, state:'안 봄', got:0};
    });
    render();

    if(A.manual){
      autoLog('직접 모드 · 쿠팡은 열지 않습니다. 키워드 표에서 직접 열어주세요');
      toast('키워드 '+nf(A.kws.length)+'개를 모았습니다. 표에서 쿠팡 열기를 눌러주세요');
      return;
    }

    /* 키워드를 하나씩 보며 가격대에 맞는 쿠팡 상품을 모은다 */
    for(var i = 0; i < kws.length && A.rows.length < A.count; i++){
      if(A.stop) break;
      var kw = kws[i].keyword;
      var slot = A.kws[i] || {state:'', got:0};
      slot.state = '보는 중';
      A.step = '“'+kw+'” 쿠팡 상위에서 '+nf(A.lo)+'~'+nf(A.hi)+'원 상품을 찾는 중';
      render();
      var res = await Ext.coupangTop(kw, 20, false);
      if(res.blocked){
        autoLog('쿠팡이 접속을 막았습니다. 여기서 멈춥니다');
        blockedModal(res.error);
        break;
      }
      if(!res.ok){
        slot.state = '조회 실패';
        autoLog('쿠팡 조회 실패 · '+kw+' · '+(res.error || '이유 불명'));
        continue;
      }
      if(res.data && res.data.partner){
        autoLog('쿠팡 공식 API 로 받음 · '+kw);
      } else if(res.data && res.data.cached){
        autoLog('저장해 둔 결과 사용 · '+kw+' (쿠팡을 열지 않음)');
      }
      var readCount = ((res.data && res.data.items) || []).length;
      if(!readCount){
        slot.state = '못 읽음';
        autoLog('쿠팡에서 상품을 하나도 읽지 못함 · '+kw);
        continue;
      }

      var room = A.count - A.rows.length;
      var pool = ((res.data && res.data.items) || []);
      var related = pool.filter(function(it){ return autoRelevant(kw, it.name); });
      if(!related.length){
        slot.state = '무관한 결과';
        autoLog('검색 결과가 키워드와 무관 · '+kw+' · '+nf(pool.length)+'개 모두 버림');
        continue;
      }
      if(related.length < pool.length){
        autoLog('무관한 상품 '+nf(pool.length - related.length)+'개 걸러냄 · '+kw);
      }
      var hits = related
        .filter(function(it){
          var p = num(it.price);
          return p >= A.lo && p <= A.hi && it.url && !autoSeen(it.url, it.name) &&
                 !autoExcluded(it.name);
        })
        .sort(function(a,b){ return num(b.reviews) - num(a.reviews); })
        .slice(0, Math.min(autoPerKeyword(A.count), room));

      if(!hits.length){
        slot.state = '가격대 밖';
        autoLog('가격대 밖 · '+kw+' · 관련 '+nf(related.length)+'개 중 0개가 '+
                nf(A.lo)+'~'+nf(A.hi)+'원');
        continue;
      }

      hits.forEach(function(hit){
        A.rows.push({
          keyword: kw, url: hit.url, name: hit.name || '',
          price: num(hit.price), reviews: num(hit.reviews), rating: hit.rating || '',
          imgUrl: hit.image || '', image: '',
          from: hit.source || '쿠팡',
          cny: 0, profit: 0, state: '대기', note: '', recId: ''
        });
      });
      slot.state = '씀';
      slot.got = hits.length;
      autoLog('찾음 · '+kw+' · 관련 '+nf(related.length)+'개 중 '+nf(hits.length)+'개');
      render();
    }

    if(!A.rows.length){
      autoLog('가격대에 맞는 상품을 찾지 못했습니다');
      toast('그 가격대에서는 상품을 찾지 못했습니다. 범위를 넓혀보세요.','err');
      return;
    }

    await autoFinish();
  } catch(e){
    autoLog('오류 · '+(e && e.message ? e.message : e));
    toast('자동 소싱 중 문제가 생겼습니다.','err');
  } finally {
    await Ext.coupangSession(false);
    A.running = false;
    A.stop = false;
    A.step = '';
    Ext.backToApp(false);
    render();
  }
}

/* 모아둔 쿠팡 상품에 썸네일과 1688 후보를 붙여 보관함에 넣는다 */
async function autoFinish(){
  var A = App.auto;
  var todo = A.rows.filter(function(r){ return !r.recId; });
  if(!todo.length){ autoLog('새로 채울 상품이 없습니다'); return; }

  /* 썸네일은 고른 것만 한 번에 받는다. 상품 페이지를 다시 열면 쿠팡이 막는다. */
  {
    A.step = '썸네일 '+nf(A.rows.length)+'장을 받는 중';
    autoLog('썸네일 '+nf(A.rows.length)+'장 요청');
    render();
    var tres = await Ext.thumbs(A.rows.map(function(r){ return r.imgUrl; }), 240);
    if(tres.ok && tres.data && tres.data.images){
      tres.data.images.forEach(function(img, n){
        if(A.rows[n] && !A.rows[n].image) A.rows[n].image = img || '';
      });
    }
    render();
  }

    /* 상품마다 1688 후보를 붙여 보관함에 넣는다 */
  for(var j = 0; j < A.rows.length; j++){
    if(A.stop) break;
    var row = A.rows[j];
    if(row.recId) continue;
    row.state = '1688 찾는 중';
      A.step = '“'+(row.name||'').slice(0,16)+'” 의 1688 후보를 찾는 중';
      render();
      var found = await autoFind1688(row);

      /* 기록으로 만들어 보관함에 넣는다 */
      var rec = blankRecord(Auth.user);
      rec.title = row.keyword + ' · 자동 소싱';
      rec.coupang.url = row.url;
      rec.coupang.name = row.name;
      rec.coupang.price = row.price;
      rec.coupang.rating = row.rating;
      rec.coupang.reviews = row.reviews;
      if(row.image){
        App.imgData[row.url] = row.image;
        rec.coupang.image = await Assets.store(row.image);
      }
      rec.memo = '자동 소싱 · 키워드 “'+row.keyword+'” · '+nf(A.lo)+'~'+nf(A.hi)+'원'+
                 (row.from && row.from !== '쿠팡' ? ' · 기준 가격 '+row.from : '');

      var picked = found.slice(0, 5);   /* 이미 사진 먼저, 이름 나중 순서로 섞여 있다 */
      for(var k = 0; k < 5; k++){
        var it = picked[k];
        if(!it){ rec.candidates[k] = blankCandidate(); continue; }
        rec.candidates[k] = {
          url: it.url || '', name: it.name || '',
          price: it.price ? String(it.price) : '',
          moq: it.moq || '', opt: it.sold ? ('판매 '+it.sold) : '',
          image: it.image ? await Assets.store(it.image) : '',
          src: it.src || '', warn: it.warn || ''
        };
      }
      rec.selected = 0;

      try {
        await Store.set('records/'+rec.id, stripId(rec));
        row.recId = rec.id;
        App.records.unshift(rec);
        if(App.allRecords) App.allRecords.unshift(rec);
      } catch(e){ autoLog('저장 실패 · '+row.keyword); }

      if(picked.length){
        row.cny = num(picked[0].price);
        row.profit = calc(rec).profit;
        row.state = '완료';
        autoLog('완료 · '+row.keyword+' · 1688 최저 ¥'+row.cny.toFixed(2));
      } else {
        row.state = '1688 실패';
        autoLog('1688 후보를 찾지 못함 · '+row.keyword);
      }
    A.done = j + 1;
    render();
  }

  /* 다 돌았으면 1688 탭을 모두 닫는다 */
  var left = await Ext.close1688Tabs(false);
  if(left.ok && left.data && left.data.closed){
    autoLog('1688 탭 '+nf(left.data.closed)+'개를 닫았습니다');
  }

  var ok = A.rows.filter(function(r){ return r.state === '완료'; }).length;
  autoLog('마침 · '+nf(ok)+'개 완료');
  toast(A.stop ? '중단했습니다. 여기까지 '+nf(ok)+'개를 보관함에 넣었습니다'
               : nf(ok)+'개를 찾아 보관함에 넣었습니다');
}

async function autoReadActive(){

  var kw = (res.data && res.data.keyword) || '직접 검색';
  var pool = (res.data && res.data.items) || [];
  var related = pool.filter(function(it){ return autoRelevant(kw, it.name); });
  var room = Math.max(1, A.count - A.rows.length);
  var hits = related.filter(function(it){
      var p = num(it.price);
      return p >= A.lo && p <= A.hi && it.url &&
             !autoSeen(it.url, it.name) && !autoExcluded(it.name);

      imgUrl: hit.image || '', image: '',
      cny: 0, profit: 0, state: '대기', note: '', recId: ''
    });
  });
  var slot = A.kws.find(function(k){ return k.keyword === kw; });
  if(slot){ slot.state = '씀'; slot.got = hits.length; }
  A.ran = true;
  autoLog('직접 읽기 · '+kw+' · '+nf(hits.length)+'개 담음');
  toast(nf(hits.length)+'개를 담았습니다. 더 담거나 1688 후보 채우기를 눌러주세요');

/* =====================================================================
   판매량·매출 추정 — 남의 확장프로그램 없이 우리 힘으로 낸다.

   쿠팡은 남의 상품 판매량을 공개하지 않는다. 그래서 리뷰가 늘어난 속도를 본다.
   같은 키워드를 다시 수집하면, 그 사이 늘어난 리뷰 수와 지나간 날짜로
   하루에 몇 개씩 팔리는지를 가늠하고 한 달치로 환산한다.
   조회수는 키워드 한 달 검색량에 순위별 클릭 비율을 곱해 가늠한다.
   ===================================================================== */
var SNAP_KEEP = 10;          /* 키워드마다 들고 있을 기록 수 */
var SNAP_MIN_DAYS = 0.5;     /* 이만큼은 지나야 비교할 값이 된다 */
var SNAP_MAX_DAYS = 45;      /* 너무 오래된 기록은 쓰지 않는다 */

/* 검색 결과에서 순위별로 클릭이 몰리는 비율 */
var RANK_CTR = [0, .235, .145, .100, .074, .057, .045, .036, .030, .025, .021,
                .018, .016, .014, .012, .011, .010, .009, .008, .007, .006];

function kwKey(t){
  var h = 5381, str = String(t || '');
  for(var i=0;i<str.length;i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  return 'kw' + h.toString(36);
}
function kwVolume(keyword){
  var flat = function(t){ return String(t||'').replace(/\s+/g,''); };
  var want = flat(keyword);
  var row = (App.kw.rows || []).filter(function(r){ return flat(r.keyword) === want; })[0];
  return row ? num(row.total) : 0;
}

/* 리뷰 작성률 — 산 사람 100명 중 리뷰를 남기는 사람 수 */
function rankRate(){ return num(App.rank.rate) || 3; }

function soldOf(it){
  if(num(it.sold)) return num(it.sold);
  if(num(it.estDaily) > 0) return Math.round(num(it.estDaily) * 30 / (rankRate() / 100));
  return 0;
}
function revOf(it){
  if(num(it.revenue)) return num(it.revenue);
  var s = soldOf(it);
  return s ? s * num(it.price) : 0;
}
function viewsOf(it){ return num(it.views) || num(it.estViews); }
function cvrOf(it){
  if(num(it.cvr)) return num(it.cvr);
  var v = viewsOf(it), s = soldOf(it);
  return (v && s) ? Math.round(s / v * 1000) / 10 : 0;
}
function isEstimate(it){ return !num(it.sold) && num(it.estDaily) > 0; }

/* 쿠팡 윙에서 최근 28일 판매량과 조회수를 받아 채운다.
   추정이 아니라 쿠팡이 주는 값이라 이쪽이 먼저다.
   윙에 로그인한 탭이 없으면 조용히 넘어가고 리뷰 추정으로 간다. */
async function fillWing28(items){
  if(!Ext.present) return {ok:false, why:'확장프로그램이 없습니다.'};
  var ids = items.map(function(it){
    var m = String(it.productId || it.url || '').match(/(\d{5,})/);
    return m ? m[1] : '';
  }).filter(Boolean);
  if(!ids.length) return {ok:false, why:'상품번호를 찾지 못했습니다.'};

  var res = await Ext.wing28Batch(ids);
  if(!res.ok){
    return {ok:false, needsWing:!!res.needsWing, needsLogin:!!res.needsLogin,
            why: res.error || '윙에서 받지 못했습니다.'};
  }
  var stats = (res.data && res.data.stats) || {};
  var got = 0;
  items.forEach(function(it){
    var m = String(it.productId || it.url || '').match(/(\d{5,})/);
    var d = m ? stats[m[1]] : null;
    if(!d || d.sold == null) return;
    it.sold = num(d.sold);
    it.views = num(d.views);
    it.revenue = it.sold * num(it.price);
    it.cvr = it.views ? Math.round(it.sold / it.views * 1000) / 10 : 0;
    got++;
  });
  return {ok:true, got:got, total:ids.length};
}

/* 이번에 본 값을 기록해 두고, 지난 기록이 있으면 늘어난 리뷰로 판매량을 가늠한다 */
async function estimateSales(keyword, items){
  var path = 'sales/' + kwKey(keyword);
  var doc = null;
  try { doc = await Store.get(path); } catch(e){ doc = null; }
  var snaps = (doc && doc.snaps) || [];
  var now = Date.now();

  var mine = items.map(function(it){
    return { pid: String(it.productId || it.url || ''), r: num(it.reviews), p: num(it.price) };
  });

  /* 쓸 수 있는 기록 중 가장 오래된 것을 기준점으로 삼는다. 기간이 길수록 덜 흔들린다. */
  var base = null;
  for(var i = snaps.length - 1; i >= 0; i--){
    var d = (now - Date.parse(snaps[i].at || 0)) / 86400000;
    if(d >= SNAP_MIN_DAYS && d <= SNAP_MAX_DAYS){ base = snaps[i]; break; }
  }

  var vol = kwVolume(keyword);
  items.forEach(function(it){
    it.estDaily = 0; it.estDays = 0;
    if(vol > 0){
      var ctr = RANK_CTR[num(it.rank)] || 0.005;
      it.estViews = Math.round(vol * ctr);
    }
    if(!base) return;
    var pid = String(it.productId || it.url || '');
    var was = (base.items || []).filter(function(x){ return x.pid === pid; })[0];
    if(!was) return;
    var days = (now - Date.parse(base.at)) / 86400000;
    var grew = num(it.reviews) - num(was.r);
    if(days < SNAP_MIN_DAYS || grew < 0) return;
    it.estDaily = grew / days;
    it.estDays = Math.round(days * 10) / 10;
  });

  /* 같은 날 여러 번 수집해도 기록이 쌓이지 않게, 6시간 안쪽이면 최신 기록을 덮어쓴다 */
  var fresh = snaps.length && (now - Date.parse(snaps[0].at || 0)) < 6 * 3600000;
  if(fresh) snaps[0] = { at: new Date(now).toISOString(), items: mine };
  else snaps.unshift({ at: new Date(now).toISOString(), items: mine });
  try {
    await Store.set(path, { keyword: String(keyword || ''), snaps: snaps.slice(0, SNAP_KEEP) });
  } catch(e){ /* 저장 실패는 화면 표시에 영향 없음 */ }

  return { based: !!base, volume: vol };
}

function rankStats(items){
  var prices = items.map(function(x){ return num(x.price); }).filter(function(p){ return p > 0; });
  var sorted = prices.slice().sort(function(a,b){ return a-b; });
  var mid = sorted.length
    ? (sorted.length % 2 ? sorted[(sorted.length-1)/2]
       : (sorted[sorted.length/2-1] + sorted[sorted.length/2]) / 2)
    : 0;
  return {
    count: items.length,
    avg: prices.length ? prices.reduce(function(s,p){ return s+p; },0) / prices.length : 0,
    median: mid,
    min: sorted.length ? sorted[0] : 0,
    max: sorted.length ? sorted[sorted.length-1] : 0,
    reviews: items.reduce(function(s,x){ return s + num(x.reviews); }, 0),
    rocket: items.filter(function(x){ return x.rocket; }).length
  };
}

/* 노출 순위 표에서 칸마다 견줄 값을 꺼낸다 */
var RANK_COLS = {
  rank:    function(x){ return num(x.rank); },
  name:    function(x){ return String(x.name || ''); },
  price:   function(x){ return num(x.price) || null; },
  rating:  function(x){ return num(x.rating) || null; },
  reviews: function(x){ return num(x.reviews); },
  sold:    function(x){ return soldOf(x) || null; },
  revenue: function(x){ return revOf(x) || null; },
  views:   function(x){ return viewsOf(x) || null; },
  ship:    function(x){ return x.rocket ? 2 : (x.freeShip ? 1 : null); }
};
function rankHead(col, label, cls, style){
  var on = App.rank.col === col;
  var arrow = on ? (App.rank.dir < 0 ? ' ▼' : ' ▲') : '';
  return '<th data-sort="'+col+'"'+(cls ? ' class="'+cls+'"' : '')+
    ' style="'+(style||'')+(on ? 'color:var(--teal);' : '')+'">'+esc(label)+arrow+'</th>';
}

function viewRank(){
  var r = App.rank;
  var items = r.items.slice();
  if(r.col){
    var get = RANK_COLS[r.col];
    if(get) items.sort(function(a,b){
      var x = get(a), y = get(b);
      var xn = (x === null || x === undefined || x === '');
      var yn = (y === null || y === undefined || y === '');
      if(xn && yn) return 0;
      if(xn) return 1;
      if(yn) return -1;
      if(typeof x === 'string') return r.dir * x.localeCompare(y, 'ko');
      return r.dir * (x - y);
    });
  }
  var st = rankStats(items);
  var hasSales = items.some(function(x){ return soldOf(x) || revOf(x) || viewsOf(x); });
  var soldSum = items.reduce(function(a,x){ return a + soldOf(x); }, 0);
  var revSum  = items.reduce(function(a,x){ return a + revOf(x); }, 0);
  var anyEst  = items.some(isEstimate);

  var head =
  '<div class="page-head">'+
    '<div><h2>“'+esc(r.keyword)+'” 쿠팡 노출 순위</h2>'+
      '<p>광고를 뺀 상위 '+nf(items.length)+'개입니다. '+esc(fmtDate(r.at))+' 기준이며, 순위는 검색할 때마다 바뀝니다.</p></div>'+
    '<div class="actions">'+
      '<button class="act" data-nav="keywords"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>키워드로 돌아가기</button>'+
      '<button class="act" id="rankAgain"'+(App.busy['rank_'+r.keyword]?' disabled':'')+'>'+
        (App.busy['rank_'+r.keyword] ? '수집 중' : '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-2.6-6.4"/><path d="M21 4v5h-5"/></svg>다시 수집')+'</button>'+
      '<button class="act" id="rankCopy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>표 복사</button>'+
    '</div>'+
  '</div>';

  var kpis =
  '<div class="kpis">'+
    '<div class="kpi"><div class="k">평균 판매가</div><div class="v num">'+won(st.avg)+'</div>'+
      '<div class="s num">중앙값 '+won(st.median)+'</div></div>'+
    '<div class="kpi"><div class="k">가격 범위</div><div class="v num">'+won(st.min)+'</div>'+
      '<div class="s num">최고 '+won(st.max)+'</div></div>'+
    '<div class="kpi"><div class="k">로켓배송 비중</div><div class="v num">'+
      Math.round(st.rocket / Math.max(1, st.count) * 100)+'%</div>'+
      '<div class="s num">'+nf(st.rocket)+' / '+nf(st.count)+'개</div></div>'+
    (hasSales
      ? '<div class="kpi hero"><div class="k">상위 노출 월 매출'+(anyEst ? ' 추정' : '')+' 합계</div>'+
          '<div class="v num">'+manwon(revSum)+'</div>'+
          '<div class="s">판매량 합계 '+nf(soldSum)+'개 · 리뷰 합계 '+nf(st.reviews)+'</div></div>'
      : '<div class="kpi hero"><div class="k">상위 노출 리뷰 합계</div><div class="v num">'+nf(st.reviews)+'</div>'+
          '<div class="s">리뷰가 적을수록 비집고 들어갈 틈이 있습니다</div></div>')+

async function useRankItem(rank){
  var it = App.rank.items.find(function(x){ return String(x.rank) === String(rank); });
  if(!it) return;
  App.busy['use_'+rank] = true;
  Progress.open('소싱 준비 중입니다', rank+'위 상품으로 1688 비교를 시작합니다.');
  Progress.step('상품 정보를 옮기는 중');
  render();

  var rec = blankRecord(Auth.user);
  rec.source = 'coupang';
  rec.title = App.rank.keyword + ' · ' + rank + '위';
  rec.coupang.url = it.url || '';
  rec.coupang.name = it.name || '';
  rec.coupang.price = num(it.price);
  rec.coupang.rating = it.rating || '';
  rec.coupang.reviews = num(it.reviews);
  rec.memo = '키워드 “'+App.rank.keyword+'” 쿠팡 '+rank+'위 상품';
  if(it.image){
    if(it.image.indexOf('data:') === 0 && it.url) App.imgData[it.url] = it.image;
    rec.coupang.image = await Assets.store(it.image);
  }

  App.busy['use_'+rank] = false;
  Progress.close();
  App.record = rec;
  go('compare');
  toast(rank+'위 상품으로 비교 분석을 시작합니다. 1688 링크를 넣어보세요.');
}

function bindRank(){
  $$('[data-sort]').forEach(function(th){
    th.onclick = function(){
      var col = th.getAttribute('data-sort');
      if(App.rank.col === col) App.rank.dir = App.rank.dir < 0 ? 1 : -1;
      else { App.rank.col = col; App.rank.dir = (col === 'name' || col === 'rank') ? 1 : -1; }
      render();
    };
  });
  var again = $('#rankAgain');
  if(again) again.onclick = function(){ openRanking(App.rank.keyword); };
  var wingBtn = $('#rankWing');
  if(wingBtn) wingBtn.onclick = async function(){
    var r = await Ext.wingOpen();
    if(r.ok) toast('윙을 열었습니다. 로그인한 뒤 다시 수집을 눌러주세요');
    else toast(r.error || '윙을 열지 못했습니다.','err');
  };
  var rate = $('#rankRate');
  if(rate) rate.onchange = function(){
    App.rank.rate = num(rate.value) || 3;
    App.jumpTop = false;
    render();
  };
  $$('[data-rank-open]').forEach(function(b){
    b.onclick = function(){ window.open(b.getAttribute('data-rank-open'), '_blank', 'noopener'); };
  });
  $$('[data-rank-review]').forEach(function(b){
    b.onclick = function(){
      var it = App.rank.items.filter(function(x){ return String(x.rank) === b.getAttribute('data-rank-review'); })[0];
      if(it) reviewInsightModal({ url: it.url, name: it.name });
    };
  });
  $$('[data-rank-use]').forEach(function(b){
    b.onclick = function(){ useRankItem(b.getAttribute('data-rank-use')); };
  });
  var copy = $('#rankCopy');
  if(copy) copy.onclick = function(){
    var text = ['순위\t상품명\t판매가\t월 판매량\t월 매출\t조회수\t전환율\t근거\t별점\t리뷰\t배송\t링크'].concat(
      App.rank.items.map(function(it){
        return [it.rank, it.name, num(it.price), soldOf(it), revOf(it), viewsOf(it),
                cvrOf(it) ? cvrOf(it)+'%' : '',
                isEstimate(it) ? '추정' : (num(it.sold) ? '수집' : ''),
                it.rating || '', num(it.reviews),
                it.rocket ? '로켓' : (it.freeShip ? '무료' : ''), it.url].join('\t');
      })
    ).join('\n');
    navigator.clipboard.writeText(text).then(
      function(){ toast('표를 복사했습니다. 엑셀에 붙여넣으세요'); },
      function(){ toast('복사하지 못했습니다.','err'); }
    );
  };
}

var CAT_SORTS = 'sorter=saleCountDesc';

function catBuildUrl(base, lo, hi){
  var raw = String(base || '').trim();
  if(!raw) return '';
  var u;
  try { u = new URL(raw); } catch(e){ return ''; }
  if(!/coupang\.com$/i.test(u.hostname.replace(/^www\./,''))) return '';
  u.searchParams.set('minPrice', String(Math.max(0, num(lo))));
  u.searchParams.set('maxPrice', String(Math.max(0, num(hi))));
  u.searchParams.set('listSize', '60');
  u.searchParams.set('sorter', 'saleCountDesc');
  u.searchParams.set('page', '1');
  return u.toString();
}

  sold:    function(x){ return num(x.sold) || null; },

          '<td class="r"><span class="sold-cell'+(num(it.sold) ? '' : ' thin')+'">'+
            (num(it.sold) ? nf(it.sold) : '-')+'</span></td>'+
          '<td class="r"><span class="rev-money'+(num(it.revenue) ? '' : ' thin')+'">'+
            (num(it.revenue) ? manwon(it.revenue) : '-')+'</span>'+
            (num(it.cvr) ? '<div class="sm" style="text-align:right;">전환 '+esc(String(it.cvr))+'%</div>' : '')+
          '</td>'+
          '<td class="r"><span class="rev-cell'+(rv < 10 ? ' thin' : '')+'">'+nf(rv)+'</span></td>'+
          '<td class="c">'+(it.rocket ? '<span class="pill good">로켓</span>'
                  : (it.freeShip ? '<span class="pill gray">무료</span>' : '<span style="color:var(--sub2);">-</span>'))+'</td>'+
          '<td><div class="row-btns">'+
            '<button class="tiny" data-cb-open="'+esc(it.url)+'">쿠팡</button>'+
            '<button class="tiny" data-cb-review="'+esc(String(it.rank))+'">리뷰</button>'+
            '<button class="tiny go" data-cb-use="'+esc(String(it.rank))+'"'+
              (App.busy['cb_'+it.rank]?' disabled':'')+'>'+
              (App.busy['cb_'+it.rank] ? '준비 중' : '소싱하기')+'</button>'+
          '</div></td>'+
          '<td class="pad"></td>'+
        '</tr>';
      }).join('')+'</tbody>'+
    '</table></div>'+
  '</div>';

  return head + form + kpis + table;
}

async function catLoadTree(force){
  var C = App.cb;
  if(!Ext.present){ toast('확장프로그램이 연결되지 않았습니다.','err'); return; }
  C.loadingTree = true; C.error = '';
  Progress.open('쿠팡에서 카테고리 목록을 읽는 중입니다',
    '한 번만 읽어두면 이레 동안 그대로 씁니다.');
  render();

  var res = await Ext.catTree(force);
  C.loadingTree = false;
  Progress.close();

  if(!res.ok){
    C.error = res.error || '카테고리 목록을 가져오지 못했습니다.';
    render();
    if(res.blocked) blockedModal(res.error);
    else toast(C.error,'err');
    return;
  }
  var tree = (res.data && res.data.tree) || [];
  if(!tree.length){
    C.error = '카테고리를 하나도 읽지 못했습니다. 쿠팡 첫 화면을 열어둔 채 다시 시도해주세요.';
    render();
    toast(C.error,'err');
    return;
  }
  C.tree = tree;
  C.treeAt = nowIso();
  C.c1 = ''; C.c2 = ''; C.c3 = ''; C.picked = '';
  App.jumpTop = false;
  render();
  var deep = tree.reduce(function(a,t){
    return a + (t.kids||[]).reduce(function(b,m){ return b + (m.kids||[]).length; }, 0);
  }, 0);
  toast('대분류 '+nf(tree.length)+'개, 소분류 '+nf(deep)+'개를 읽었습니다'+
        (res.data && res.data.cached ? ' (저장해 둔 목록)' : ''));
}

/* 소분류를 고르면 곧바로 쿠팡을 열고, 화면이 뜨면 이어서 읽는다 */
async function catPick(id){
  var C = App.cb;
  C.c3 = id;
  var top = (C.tree||[]).filter(function(t){ return t.id === C.c1; })[0];
  var mid = top ? (top.kids||[]).filter(function(t){ return t.id === C.c2; })[0] : null;
  var leaf = mid ? (mid.kids||[]).filter(function(t){ return t.id === id; })[0] : null;
  if(!leaf){ render(); return; }

  C.url = leaf.url || ('https://www.coupang.com/np/categories/' + leaf.id);
  C.picked = [top && top.name, mid && mid.name, leaf.name].filter(Boolean).join(' > ');
  C.items = []; C.seen = 0; C.error = '';
  render();

  await catOpen();
  if(App.cb.error) return;
  await catRead();
}

async function catOpen(){
  var C = App.cb;

    C.error = '쿠팡 카테고리 주소를 붙여넣어 주세요. 쿠팡에서 카테고리를 연 뒤 주소창을 그대로 복사하시면 됩니다.';
    render();

  }
  C.running = true; C.error = ''; C.step = '쿠팡 여는 중';

  C.running = false; C.step = '';

    C.error = res.error || '쿠팡을 열지 못했습니다.';
    render();
    if(res.blocked) blockedModal(res.error);

}

async function catRead(){
  var C = App.cb;
  var pages = Math.max(1, Math.min(5, num(C.pages) || 1));
  C.running = true; C.error = '';
  Progress.open('쿠팡 목록을 읽는 중입니다',
    '탭 하나만 쓰고 쪽 사이에 쉬어갑니다. 잠시만 기다려주세요.');
  render();

  var pool = [];
  var seen = {};
  for(var i = 0; i < pages; i++){
    if(i > 0){
      C.step = (i+1)+'쪽으로 넘기는 중';
      Progress.step((i+1)+'쪽으로 넘기는 중 · 쿠팡이 막지 않도록 쉬어갑니다');
      render();
      var nx = await Ext.coupangNextPage();
      if(!nx.ok){
        C.error = nx.error || '다음 쪽으로 넘기지 못했습니다.';
        if(nx.blocked){ Progress.close(); C.running = false; C.step = ''; render(); blockedModal(nx.error); break; }
        break;
      }
    }
    C.step = (i+1)+'쪽 읽는 중';
    Progress.step((i+1)+'쪽 읽는 중');
    render();

    var res = await Ext.readActiveCoupang(40);
    if(!res.ok){
      C.error = res.error || '그 화면을 읽지 못했습니다.';
      break;
    }
    var got = (res.data && res.data.items) || [];
    got.forEach(function(it){
      var key = String(it.productId || it.url || '');
      if(!key || seen[key]) return;
      seen[key] = true;
      pool.push(it);
    });
    if(!got.length) break;
  }

  C.seen = pool.length;
  var lo = num(C.lo), hi = num(C.hi);
  var fit = pool.filter(function(it){
    var p = num(it.price);
    return p >= lo && p <= hi;
  });

  if(!fit.length){
    C.running = false; C.step = '';
    Progress.close();
    if(!C.error) C.error = '본 '+nf(pool.length)+'개 중 그 가격대에 든 상품이 없습니다. 가격대를 넓혀보세요.';
    render();
    toast(C.error, 'err');
    return;
  }

  Progress.step('윙에서 28일 실적을 받는 중');
  render();
  var wing = await fillWing28(fit);
  C.wing = wing;

  /* 쿠팡 화면에서 읽은 그림 주소는 이 화면에서 바로 뜨지 않는다.
     수집기를 거쳐 그림 자체를 받아와야 깨지지 않는다. */
  Progress.step('썸네일 '+nf(fit.length)+'장을 받는 중');
  render();
  var raw = fit.map(function(it){ return it.image || ''; });
  if(raw.filter(Boolean).length){
    var tres = await Ext.thumbs(raw, 200);
    if(tres.ok && tres.data && tres.data.images){
      tres.data.images.forEach(function(img, n){
        if(fit[n] && img) fit[n].image = img;
      });
    }
  }

  fit.sort(function(a,b){ return num(b.sold) - num(a.sold) || num(b.reviews) - num(a.reviews); });
  fit.forEach(function(it, i){ it.rank = i + 1; });

  C.items = fit;
  C.at = nowIso();
  C.col = ''; C.dir = -1;
  C.running = false; C.step = '';
  Progress.close();
  App.jumpTop = false;
  render();
  toast('가격대에 든 '+nf(fit.length)+'개를 찾았습니다'+
        (wing && wing.ok ? ' · 판매량 '+nf(wing.got)+'개 확인' : ''));
}

async function useCatItem(rank){
  var it = App.cb.items.filter(function(x){ return String(x.rank) === String(rank); })[0];
  if(!it) return;
  App.busy['cb_'+rank] = true;
  Progress.open('소싱 준비 중입니다', rank+'위 상품으로 1688 비교를 시작합니다.');
  render();

  var rec = blankRecord(Auth.user);
  rec.source = 'coupang';
  rec.title = '카테고리 ' + rank + '위 · ' + String(it.name || '').slice(0, 20);
  rec.coupang.url = it.url || '';
  rec.coupang.name = it.name || '';
  rec.coupang.price = num(it.price);
  rec.coupang.rating = it.rating || '';
  rec.coupang.reviews = num(it.reviews);
  rec.memo = '카테고리 베스트 '+rank+'위 · '+won(it.price)+
             (num(it.sold) ? ' · 28일 판매 '+nf(it.sold)+'개' : '')+
             (num(it.revenue) ? ' · 28일 매출 '+manwon(it.revenue) : '');

    if(it.image.indexOf('data:') === 0) App.imgData[rec.id] = it.image;
    rec.coupang.image = await Assets.store(it.image);
  }

  App.busy['cb_'+rank] = false;
  App.record = rec;
  Progress.close();
  go('compare');
  toast(rank+'위 상품으로 비교 분석을 시작합니다');
}

  var lo = $('#cbLo');
  if(lo) lo.oninput = function(){ C.lo = num(lo.value); };
  var hi = $('#cbHi');
  if(hi) hi.oninput = function(){ C.hi = num(hi.value); };

  var t1 = $('#cbTreeLoad');

  var s1 = $('#cbC1');
  if(s1) s1.onchange = function(){
    C.c1 = s1.value; C.c2 = ''; C.c3 = ''; C.picked = '';
    App.jumpTop = false; render();
  };
  var s2 = $('#cbC2');
  if(s2) s2.onchange = function(){
    C.c2 = s2.value; C.c3 = ''; C.picked = '';
    App.jumpTop = false; render();
  };
  var s3 = $('#cbC3');

    if(hi) C.hi = num(hi.value);

    render();

      else { C.col = col; C.dir = (col === 'name' || col === 'rank') ? 1 : -1; }
      App.jumpTop = false;
      render();
    };
  });
  $$('[data-cb-open]').forEach(function(b){
    b.onclick = function(){ window.open(b.getAttribute('data-cb-open'), '_blank', 'noopener'); };
  });
  $$('[data-cb-review]').forEach(function(b){
    b.onclick = function(){
      var it = App.cb.items.filter(function(x){ return String(x.rank) === b.getAttribute('data-cb-review'); })[0];
      if(it) reviewInsightModal({ url: it.url, name: it.name });
    };
  });
  $$('[data-cb-use]').forEach(function(b){
    b.onclick = function(){ useCatItem(b.getAttribute('data-cb-use')); };
  });
  var cp = $('#cbCopy');
  if(cp) cp.onclick = function(){
    var text = ['순위\t상품명\t판매가\t28일판매량\t28일매출\t전환율\t리뷰\t배송\t링크'].concat(
      App.cb.items.map(function(it){
        return [it.rank, it.name, num(it.price), num(it.sold), num(it.revenue),
                num(it.cvr) ? it.cvr+'%' : '', num(it.reviews),
                it.rocket ? '로켓' : (it.freeShip ? '무료' : ''), it.url].join('\t');
      })
    ).join('\n');
    navigator.clipboard.writeText(text).then(
      function(){ toast('표를 복사했습니다. 엑셀에 붙여넣으세요'); },
      function(){ toast('복사하지 못했습니다.','err'); }

  };

/* =======================================================================
   9-2. 타오바오 베스트 — 무엇이 팔리는지 먼저 보고, 그 물건을 1688에서 산다.

   예전 순위 사이트는 없어졌다. 지금은 검색 결과를 판매량 순으로 세운 것이
   사실상의 베스트 목록이다. 카드마다 결제 인원이 붙어 있어 그것을 판매량으로 본다.
   타오바오는 소매라 매입가로 쓰지 않는다. 무엇이 팔리는지 보는 용도다.
   ======================================================================= */
var TB_COLS = {
  rank:  function(x){ return num(x.rank); },
  name:  function(x){ return String(x.name || ''); },
  price: function(x){ return num(x.price) || null; },
  sold:  function(x){ return num(x.sold) || null; },
  board: function(x){ return num(x.boardRank) || null; },
  shop:  function(x){ return String(x.shop || ''); }
};
function tbHead(col, label, cls){
  var on = App.tb.col === col;
  var arrow = on ? (App.tb.dir < 0 ? ' ▼' : ' ▲') : '';
  return '<th data-tbsort="'+col+'"'+(cls ? ' class="'+cls+'"' : '')+
    (on ? ' style="color:var(--teal);"' : '')+'>'+esc(label)+arrow+'</th>';
}

      if(xn) return 1;

/* 타오바오는 한국어를 모른다. 한글을 그대로 넣으면 전혀 다른 물건이 나온다.
   그래서 한글이 섞여 있으면 반드시 중국어로 바꾼 뒤에 검색한다. */
function hasHangul(t){ return /[\uAC00-\uD7A3]/.test(String(t || '')); }

/* 검색어와 상품명이 실제로 관련 있는지 본다.
   타오바오는 못 찾으면 엉뚱한 추천 상품을 대신 보여주는데, 그걸 걸러낸다. */
function tbRelevant(term, name){
  var t = String(term || '').replace(/\s+/g, '');
  var n = String(name || '');
  if(t.length < 2 || !n) return true;
  for(var i = 0; i + 2 <= t.length; i++){
    if(n.indexOf(t.slice(i, i + 2)) >= 0) return true;
  }
  return false;
}

async function runTaobao(){
  var T = App.tb;
  var kw = String(T.keyword || '').trim();
  if(!kw && !String(T.cn || '').trim()){ toast('키워드를 넣어주세요.','err'); return; }
  if(!Ext.present){ toast('확장프로그램이 연결되지 않았습니다.','err'); return; }

  if(!(await ensureShopLogin('taobao'))) return;

  T.running = true; T.error = ''; T.dropped = 0;
  Progress.open('타오바오에서 인기 상품을 모으는 중입니다', '“'+(kw || T.cn)+'” 로 시작합니다.');
  render();

  /* 1) 타오바오에 넣을 중국어 검색어를 정한다 */
  var term = String(T.cn || '').trim();
  if(!term){
    if(hasHangul(kw)){
      Progress.step('검색어를 중국어로 바꾸는 중');
      var got = await Sampler.searchTerm(kw);
      if(got && got.keyword){
        term = got.keyword;
        T.alt = got.alt || [];
      } else {
        T.running = false;
        Progress.close();
        T.error = '“'+kw+'” 를 중국어로 바꾸지 못했습니다. 중국어 검색어 칸에 직접 넣어주세요. '+
                  '타오바오는 한국어를 알아듣지 못해 그대로 넣으면 엉뚱한 물건이 나옵니다.';
        render();
        toast('중국어 검색어가 필요합니다.','err');
        return;
      }
    } else {
      term = kw;
    }
  }
  T.used = term;

  /* 2) 그 말로 판매량 순 검색 */
  Progress.step('타오바오에서 “'+term+'” 판매량 순으로 읽는 중');
  render();

  var res = await Ext.taobaoTop(term, num(T.count) || 20);
  T.running = false;

  if(!res.ok){
    Progress.close();
    T.error = res.error || '타오바오에서 상품을 가져오지 못했습니다.';
    render();
    if(res.needsLogin){ if(await shopLoginModal('taobao')) return runTaobao(); return; }
    toast(T.error,'err');
    return;
  }

  var items = (res.data && res.data.items) || [];
  if(!items.length){
    Progress.close();
    T.error = '“'+term+'” 결과가 비어 있습니다. 다른 중국어 검색어로 바꿔보세요.';
    render();
    toast(T.error,'err');
    return;
  }

  /* 3) 검색어와 상관없는 추천 상품을 걸러낸다 */
  Progress.step('검색어와 맞는 상품만 고르는 중');
  var fit = items.filter(function(it){ return tbRelevant(term, it.name); });
  if(fit.length >= 3){
    T.dropped = items.length - fit.length;
    items = fit;
  } else {
    T.dropped = 0;
    T.error = '“'+term+'” 와 맞는 상품이 거의 없습니다. 타오바오가 추천 상품을 대신 보여준 것으로 보입니다. '+
              '중국어 검색어를 바꿔보세요.';
  }
  items.forEach(function(it, i){ it.rank = i + 1; });

  T.items = items;
  T.at = nowIso();
  T.col = ''; T.dir = -1;
  Progress.close();
  App.jumpTop = false;
  render();
  toast('“'+term+'” 인기 상품 '+nf(items.length)+'개를 가져왔습니다'+
        (T.dropped ? ' · 무관한 '+nf(T.dropped)+'개 제외' : ''));
}

/* 고른 타오바오 상품의 사진과 중국어 상품명으로 1688 매입처를 찾는다.
   상품명이 이미 중국어라 번역 단계를 건너뛴다. 그래서 쿠팡에서 시작할 때보다 잘 맞는다. */
async function useTaobaoItem(rank){
  var it = App.tb.items.filter(function(x){ return String(x.rank) === String(rank); })[0];
  if(!it) return;
  App.busy['tb_'+rank] = true;
  Progress.open('1688 매입처를 찾을 준비 중입니다', '타오바오 '+rank+'위 상품으로 시작합니다.');
  Progress.step('상품 정보를 옮기는 중');
  render();

  var rec = blankRecord(Auth.user);
  rec.source = 'taobao';
  rec.srcPrice = '¥' + num(it.price).toFixed(2) + ' · ' + won(num(it.price) * effRate(null));
  rec.title = '타오바오 · ' + String(it.name || '').slice(0, 24);
  rec.coupang.url = it.url || '';
  rec.coupang.name = it.name || '';
  rec.coupang.price = '';
  rec.memo = '타오바오 “'+App.tb.keyword+'” '+rank+'위 · ¥'+num(it.price).toFixed(2)+
             ' · 결제 '+nf(num(it.sold))+'명'+(it.shop ? ' · '+it.shop : '')+
             '\n타오바오 주소: '+(it.url || '');
  if(it.image){
    /* 사진 검색이 쓸 원본을 이번 방문 동안 들고 있는다 */
    if(it.image.indexOf('data:') === 0) App.imgData[rec.id] = it.image;
    rec.coupang.image = await Assets.store(it.image);
  }

  App.busy['tb_'+rank] = false;
  App.record = rec;
  Progress.close();
  go('compare');
  toast('타오바오 '+rank+'위 상품입니다. 1688에서 찾기를 누르세요');
}

function bindTaobao(){
  var T = App.tb;
  var kw = $('#tbKw');
  if(kw){
    kw.oninput = function(){ T.keyword = kw.value; };
    kw.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); runTaobao(); } };
  }
  var cn = $('#tbCn');
  if(cn){
    cn.oninput = function(){ T.cn = cn.value; };
    cn.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); runTaobao(); } };
  }
  var cnt = $('#tbCount');
  if(cnt) cnt.onchange = function(){ T.count = num(cnt.value) || 20; };
  var go1 = $('#tbGo');
  if(go1) go1.onclick = function(){
    if(kw) T.keyword = kw.value;
    if(cn) T.cn = cn.value;
    runTaobao();
  };
  var again = $('#tbAgain');
  if(again) again.onclick = function(){ runTaobao(); };
  $$('[data-tb-alt]').forEach(function(b){
    b.onclick = function(){ T.cn = b.getAttribute('data-tb-alt'); runTaobao(); };
  });
  var open = $('#tbOpen');
  if(open) open.onclick = async function(){
    var r = await Ext.taobaoOpen(T.keyword || '');
    if(r.ok) toast('타오바오를 열었습니다. 로그인 상태를 확인해주세요');
    else toast(r.error || '타오바오를 열지 못했습니다.','err');
  };
  $$('[data-tbsort]').forEach(function(th){
    th.onclick = function(){
      var col = th.getAttribute('data-tbsort');
      if(T.col === col) T.dir = T.dir < 0 ? 1 : -1;
      else { T.col = col; T.dir = (col === 'name' || col === 'rank' || col === 'shop') ? 1 : -1; }
      App.jumpTop = false;
      render();
    };
  });
  $$('[data-tb-open]').forEach(function(b){
    b.onclick = function(){ window.open(b.getAttribute('data-tb-open'), '_blank', 'noopener'); };
  });
  $$('[data-tb-use]').forEach(function(b){
    b.onclick = function(){ useTaobaoItem(b.getAttribute('data-tb-use')); };
  });
  var cp = $('#tbCopy');
  if(cp) cp.onclick = function(){
    var text = ['순위\t상품명\t판매가(¥)\t결제인원\t인기순위\t점포\t지역\t링크'].concat(
      App.tb.items.map(function(it){
        return [it.rank, it.name, num(it.price), num(it.sold), it.boardRank || '',
                it.shop || '', it.area || '', it.url].join('\t');
      })
    ).join('\n');
    navigator.clipboard.writeText(text).then(
      function(){ toast('표를 복사했습니다. 엑셀에 붙여넣으세요'); },
      function(){ toast('복사하지 못했습니다.','err'); }
    );
  };
}

            '<button class="tiny" data-tm-open="'+esc(it.url)+'">테무</button>'+

              (App.busy['tm_'+it.rank]?' disabled':'')+'>'+

          '</div></td>'+
          '<td class="pad"></td>'+
        '</tr>';
      }).join('')+'</tbody>'+
    '</table></div>'+
  '</div>';

  return head + form + kpis + table;
}

async function runTemu(){
  var M = App.tm;
  if(!Ext.present){ toast('확장프로그램이 연결되지 않았습니다.','err'); return; }
  var ch = TEMU_CHANNELS.filter(function(c){ return c.id === M.channel; })[0] || TEMU_CHANNELS[0];

  if(!(await ensureShopLogin('temu'))) return;

  M.running = true; M.error = '';
  Progress.open('테무에서 '+ch.label+' 목록을 모으는 중입니다',
    (M.cat ? '갈래 “'+M.cat+'” 로 좁혀서 ' : '')+'상품을 가져옵니다. 잠시만 기다려주세요.');
  Progress.step('테무 화면을 읽는 중');
  render();

  var res = await Ext.temuTop(M.channel, num(M.count) || 20, M.cat);
  M.running = false;

  if(!res.ok){
    Progress.close();
    M.error = res.error || '테무에서 상품을 가져오지 못했습니다.';
    render();
    if(res.needsLogin){ if(await shopLoginModal('temu')) return runTemu(); return; }
    toast(M.error,'err');
    return;
  }

  var d = res.data || {};
  var items = d.items || [];
  if(!items.length){
    Progress.close();
    M.error = '결과가 비어 있습니다. 갈래를 바꾸거나 잠시 뒤에 다시 시도해주세요.';
    render();
    toast(M.error,'err');
    return;
  }
  Progress.step('상품 '+nf(items.length)+'개를 정리하는 중');
  M.items = items;
  M.picked = !!d.picked;
  M.at = nowIso();
  M.col = ''; M.dir = -1;
  Progress.close();
  App.jumpTop = false;
  render();
  toast(ch.label+' '+nf(items.length)+'개를 가져왔습니다'+(M.cat ? ' · '+M.cat : ''));
}

/* 테무 상품의 사진으로 1688 매입처를 찾는다.
   테무 상품명은 한국어라 1688 검색에는 번역이 필요하다. 사진 검색이 주력이 된다. */
async function useTemuItem(rank){
  var it = App.tm.items.filter(function(x){ return String(x.rank) === String(rank); })[0];
  if(!it) return;
  App.busy['tm_'+rank] = true;
  Progress.open('1688 매입처를 찾을 준비 중입니다', '테무 '+rank+'위 상품으로 시작합니다.');
  Progress.step('상품 정보를 옮기는 중');
  render();

  var rec = blankRecord(Auth.user);
  rec.source = 'temu';
  rec.srcPrice = won(it.price);
  rec.title = '테무 · ' + String(it.name || '').slice(0, 24);
  rec.coupang.url = it.url || '';
  rec.coupang.name = it.name || '';
  /* 테무 판매가는 원화라 쿠팡 판매가 자리에 바로 넣어 이익을 가늠할 수 있다 */
  rec.coupang.price = num(it.price) || '';
  rec.coupang.rating = num(it.rating) ? String(it.rating) : '';
  rec.coupang.reviews = num(it.reviews) || '';
  rec.memo = '테무 '+(App.tm.channel === 'star' ? '별점 5점' : '베스트셀러')+
             (App.tm.cat ? ' · '+App.tm.cat : '')+' '+rank+'위 · '+won(it.price)+
             ' · 판매 '+nf(num(it.sold))+'개'+
             (it.category ? ' · '+it.boardKind+' '+it.boardRank+'위('+it.category+')' : '')+
             '\n테무 주소: '+(it.url || '')+
             '\n판매가는 테무 가격입니다. 쿠팡에 올릴 값으로 바꿔주세요.';
  if(it.image){
    if(it.image.indexOf('data:') === 0) App.imgData[rec.id] = it.image;
    rec.coupang.image = await Assets.store(it.image);
  }

  App.busy['tm_'+rank] = false;
  App.record = rec;
  Progress.close();
  go('compare');
  toast('테무 '+rank+'위 상품입니다. 1688에서 찾기를 누르세요');
}

function bindTemu(){
  var M = App.tm;
  $$('[data-tmch]').forEach(function(b){
    b.onclick = function(){
      M.channel = b.getAttribute('data-tmch');
      M.items = []; M.error = '';
      App.jumpTop = false;
      render();
    };
  });
  var cat = $('#tmCat');
  if(cat) cat.onchange = function(){ M.cat = cat.value; };
  var cnt = $('#tmCount');
  if(cnt) cnt.onchange = function(){ M.count = num(cnt.value) || 20; };
  var go1 = $('#tmGo');
  if(go1) go1.onclick = function(){
    if(cat) M.cat = cat.value;
    runTemu();
  };
  var again = $('#tmAgain');
  if(again) again.onclick = function(){ runTemu(); };
  var open = $('#tmOpen');
  if(open) open.onclick = async function(){
    var r = await Ext.temuOpen(M.channel);
    if(r.ok) toast('테무를 열었습니다');
    else toast(r.error || '테무를 열지 못했습니다.','err');
  };
  $$('[data-tmsort]').forEach(function(th){
    th.onclick = function(){
      var col = th.getAttribute('data-tmsort');
      if(M.col === col) M.dir = M.dir < 0 ? 1 : -1;
      else { M.col = col; M.dir = (col === 'name' || col === 'rank' || col === 'category') ? 1 : -1; }
      App.jumpTop = false;
      render();
    };
  });
  $$('[data-tm-open]').forEach(function(b){
    b.onclick = function(){ window.open(b.getAttribute('data-tm-open'), '_blank', 'noopener'); };
  });
  $$('[data-tm-use]').forEach(function(b){
    b.onclick = function(){ useTemuItem(b.getAttribute('data-tm-use')); };
  });
  var cp = $('#tmCopy');
  if(cp) cp.onclick = function(){
    var text = ['순위\t상품명\t판매가\t판매수량\t별점\t리뷰\t테무순위\t갈래\t국내발송\t링크'].concat(
      App.tm.items.map(function(it){
        return [it.rank, it.name, num(it.price), num(it.sold), it.rating || '', num(it.reviews),
                num(it.boardRank) ? (it.boardKind+' '+it.boardRank+'위') : '',
                it.category || '', it.domestic ? 'Y' : '', it.url].join('\t');
      })
    ).join('\n');
    navigator.clipboard.writeText(text).then(
      function(){ toast('표를 복사했습니다. 엑셀에 붙여넣으세요'); },
      function(){ toast('복사하지 못했습니다.','err'); }
    );
  };
}

/* 이미지 검색에 쓸 썸네일. 없으면 쿠팡 상품 페이지에서 다시 받아온다. */
/* 주소로 저장된 그림을 1688 에 올릴 수 있는 형태로 바꾼다 */
async function toDataUrl(url){
  try {
    var res = await fetch(url);
    if(!res.ok) return '';
    var blob = await res.blob();
    if(!blob || blob.size < 500) return '';
    return await new Promise(function(done){
      var fr = new FileReader();
      fr.onload = function(){ done(String(fr.result || '')); };
      fr.onerror = function(){ done(''); };
      fr.readAsDataURL(blob);
    });
  } catch(e){ return ''; }
}

/* 1688 이미지 검색에 올릴 쿠팡 썸네일을 구한다.
   쿠팡을 다시 여는 것은 마지막 수단이다. 막혀 있으면 거기서 끝나기 때문이다. */
async function coupangThumbData(){
  var r = App.record;

  /* 1) 이번 방문에 받아둔 원본. 주소로도 찾고 기록 번호로도 찾는다.
        주소를 나중에 채우면 열쇠가 바뀌어 그림을 놓치기 때문이다. */
  var cached = App.imgData[r.coupang.url] || App.imgData[r.id];
  if(cached) return cached;

  /* 2) 기록에 저장된 그림이 이미 올릴 수 있는 형태면 그대로 쓴다 */
  var img = r.coupang.image || '';
  if(img.indexOf('data:') === 0){
    App.imgData[r.id] = img;
    return img;
  }

  /* 3) 주소로 저장돼 있으면 받아서 바꾼다 */
  if(/^https?:\/\//i.test(img)){
    App.busy.img = true; render();
    var conv = await toDataUrl(img);
    App.busy.img = false;
    if(conv){
      App.imgData[r.id] = conv;
      return conv;
    }
  }

  /* 4) 그래도 없으면 쿠팡 상품 페이지를 다시 읽는다.
        쿠팡에서 온 상품일 때만 쓴다. 다른 곳 주소는 수집기가 읽지 못한다. */
  if(r.source && r.source !== 'coupang') return '';
  if(!r.coupang.url) return '';
  App.busy.img = true; render();
  var res = await Ext.collect(r.coupang.url);
  App.busy.img = false;
  if(!res.ok || !res.data || !res.data.image) return '';
  App.imgData[r.coupang.url] = res.data.image;
  return res.data.image;
}

/* 쿠팡 썸네일로 1688을 뒤져 같은 물건 중 싼 것부터 5개를 채운다 */
async function findOn1688(){
  var r = App.record;
  if(!Ext.present){ toast('확장프로그램이 연결되지 않았습니다.','err'); return; }
  if(!r.coupang.url && !r.coupang.name){
    toast('먼저 '+srcOf(r).label+' 상품을 수집해주세요.','err'); return;
  }

  /* 로그인 확인부터 시간이 걸리므로, 그 전에 먼저 눌린 것을 보여준다 */
  App.busy.cn = true;
  App.busy.cnMode = '1688 로그인 확인 중';
  render();
  toast('눌렀습니다 · 1688에서 같은 물건을 찾습니다');

  if(!(await ensure1688Login())){
    App.busy.cn = false; App.busy.cnMode = '';
    render();
    return;
  }

  Progress.open('1688 에서 같은 물건을 찾는 중입니다',
    '사진과 상품명 두 가지로 함께 찾습니다.');
  Progress.step(srcOf(r).label+' 썸네일 준비 중');
  App.busy.cnMode = '썸네일 준비 중';
  render();
  var data = await coupangThumbData();

  App.assisted = false;
  App.busy.cn = true;
  App.busy.cnMode = '1688 에서 찾는 중';
  render();

  var pair = await find1688Pair(data, r.coupang.name, {
    onStep: function(t){ Progress.step(t); App.busy.cnMode = t; render(); }
  });
  App.busy.cn = false;
  App.busy.cnMode = '';

  var merged = merge1688(pair);
  if(!merged.length){
    if(pair.assisted){
      App.assisted = true;
      render();
      /* 직접 마무리하실 탭 하나만 남기고 나머지는 닫는다 */
      Ext.close1688Tabs(true);
      Progress.stuck(pair.assisted);
      return;
    }
    Progress.close();
    render();
    /* 마지막 수단 — 중국어 검색어를 직접 넣어 다시 찾는다 */
    toast(pair.noTranslate
      ? '상품명을 중국어로 바꾸지 못했습니다. 검색어를 직접 넣어주세요.'
      : '후보를 찾지 못했습니다. 검색어를 바꿔 다시 찾아보세요.', 'err');
    return findByKeyword();
  }
  if(pair.keyword) r.memo = r.memo || ('1688 검색어: ' + pair.keyword);
  /* 사진 갈래가 왜 비었는지 반드시 화면에 남긴다.
     이름 결과가 있다고 조용히 넘어가면 왜 안 되는지 알 길이 없다. */
  if(!pair.image.length){
    var why = pair.noThumb
      ? srcOf(App.record).label+' 썸네일이 없어 사진 검색을 시작하지 못했습니다.'
      : (pair.assisted || pair.imageError || '사진 검색이 결과를 내지 못했습니다.');
    App.record.imageWhy = why;
    if(pair.assisted) App.assisted = true;
    toast('사진 검색 · '+why, 'err');
  } else {
    App.record.imageWhy = '';
  }
  Progress.step('찾은 상품을 고르는 중');
  App.assisted = false;
  applyCandidates(merged, '사진+이름 (' + pair.how.join(', ') + ')', true);
}

/* =======================================================================
   1688 찾기 — 사진과 이름을 함께 쓴다.
   사진 검색은 같은 물건을 집어내지만 1688 화면 자동 조작이 자주 막힌다.
   이름 검색은 확실히 돌아가지만 비슷한 물건이 섞인다.
   그래서 이름 검색을 먼저 돌려 바닥을 깔고, 사진 검색이 되면 그 결과를 위에 얹는다.
   ======================================================================= */
async function find1688Pair(thumb, name, opts){
  var o = opts || {};
  var out = {image:[], name:[], keyword:'', assisted:'', how:[], noTranslate:false,
             noThumb:false, imageError:'', baseName: String(name || '')};
  var hasPrice = function(it){ return num(it.price) > 0; };

  /* 이름 검색 — 실패할 일이 거의 없어 먼저 돌린다 */
  if(name){
    /* 타오바오에서 온 상품은 이름이 이미 중국어다. 그래도 제목이 너무 길어
       그대로 넣으면 아무것도 안 나오므로, 짧은 검색어로 줄여서 쓴다. */
    var isCn = /[\u4e00-\u9fff]/.test(name);
    if(o.onStep) o.onStep(isCn ? '중국어 상품명을 검색어로 줄이는 중' : '상품명을 중국어로 바꾸는 중');
    var cn = await Sampler.chinese(name);
    var kw = (cn && cn.keyword) ? String(cn.keyword).trim() : '';
    if(!kw && isCn){
      /* 줄여주는 기능을 못 쓰더라도, 중국어 이름이면 앞쪽 글자를 그대로 검색어로 삼는다 */
      kw = (name.match(/[\u4e00-\u9fff]+/g) || []).join('').slice(0, 8);
    }
    if(kw){
      out.keyword = kw;
      if(o.onStep) o.onStep('“'+kw+'” 로 1688 검색 중');
      var sres = await Ext.search1688(kw, 12);
      if(sres.ok) out.name = ((sres.data && sres.data.items) || []).filter(hasPrice);
    } else {
      /* 번역을 못 하면 이름 갈래는 통째로 빠진다. 사진 갈래만 남는다. */
      out.noTranslate = true;
    }
  }

  /* 사진 검색 — 되면 가장 정확하다 */
  if(thumb){
    if(o.onStep) o.onStep('썸네일로 1688 이미지 검색 중');
    var ires = await Ext.image1688(thumb, 20, o.assist !== false);
    if(ires.ok) out.image = ((ires.data && ires.data.items) || []).filter(hasPrice);
    else if(ires.assisted) out.assisted = ires.error;
    else out.imageError = ires.error || '이미지 검색이 실패했습니다.';
  } else {
    /* 썸네일이 없으면 사진 갈래는 시도조차 못 한다. 조용히 넘어가지 않는다. */
    out.noThumb = true;
  }

  if(out.image.length) out.how.push('사진 '+nf(out.image.length)+'개');
  else if(out.noThumb) out.how.push('사진 건너뜀 (썸네일 없음)');
  else if(out.assisted) out.how.push('사진 막힘');
  else if(out.imageError) out.how.push('사진 실패');
  if(out.name.length) out.how.push('이름 '+nf(out.name.length)+'개');
  return out;
}

/* 쿠팡 상품명과 1688 상품명이 얼마나 겹치는지 센다.
   두 글자씩 끊어 몇 조각이 겹치는지 보는 방식이다.
   "접이식 탁상 거치대" 와 "접이식 금속 데스크탑 브래킷" 은 접이, 이식 이 겹친다. */
function nameScore(base, cand){
  var clean = function(t){
    return String(t || '').toLowerCase().replace(/[^가-힣a-z0-9]/g, '');
  };
  var b = clean(base), c = clean(cand);
  if(b.length < 2 || !c) return 0;
  var seen = {}, hit = 0;
  for(var i = 0; i < b.length - 1; i++){
    var g = b.slice(i, i + 2);
    if(seen[g]) continue;
    seen[g] = 1;
    if(c.indexOf(g) >= 0) hit++;
  }
  return hit;
}

/* 값들의 한가운데 가격. 터무니없이 싼 것을 걸러내는 기준이 된다. */
function medianPrice(list){
  var ps = list.map(function(it){ return num(it.price); })
               .filter(function(p){ return p > 0; })
               .sort(function(a,b){ return a - b; });
  if(!ps.length) return 0;
  var m = Math.floor(ps.length / 2);
  return ps.length % 2 ? ps[m] : (ps[m-1] + ps[m]) / 2;
}

/* 두 갈래 결과를 섞는다.
   사진 갈래는 1688 이 닮은 순으로 준 것이라 그 순서를 존중한다.
   가격만 보고 줄 세우면 ¥0.29 짜리 엉뚱한 부속품이 1등으로 올라온다. */
var IMAGE_POOL = 8;    /* 사진 갈래에서 닮은 순으로 이만큼만 본다 */
var LOW_RATIO = 0.35;  /* 한가운데 가격의 이 아래면 다른 물건으로 본다 */
var HIGH_RATIO = 4;    /* 이 위면 더 큰 물건이나 묶음으로 본다 */

function merge1688(pair){
  var seen = {};
  var dedupe = function(list, src){
    return list.filter(function(it){
      var key = it.url || ((it.name || '') + '|' + it.price);
      if(seen[key]) return false;
      seen[key] = true;
      it.src = src;
      return true;
    });
  };

  /* 사진 갈래는 닮은 순 앞쪽만 본다. 뒤로 갈수록 닮지 않은 물건이다. */
  var im = dedupe((pair.image || []).slice(0, IMAGE_POOL), '사진');
  var nm = dedupe(pair.name || [], '이름');

  /* 한가운데 가격에서 크게 벗어난 것은 다른 물건으로 보고 뒤로 미룬다 */
  var med = medianPrice(im.concat(nm));
  var sane = [], odd = [];
  im.concat(nm).forEach(function(it){
    var pr = num(it.price);
    if(med && pr < med * LOW_RATIO){ it.warn = '값이 너무 쌉니다'; odd.push(it); }
    else if(med && pr > med * HIGH_RATIO){ it.warn = '값이 너무 비쌉니다'; odd.push(it); }
    else { sane.push(it); }
  });
  if(!sane.length){ sane = odd; odd = []; }

  var byPrice = function(a,b){ return num(a.price) - num(b.price); };

  /* 이름이 더 많이 겹치는 것을 앞에 둔다. 같은 만큼 겹치면 싼 쪽이 앞이다.
     값만 보고 줄 세우면 전혀 다른 물건이 1등이 된다. */
  var base = pair.baseName || '';
  sane.forEach(function(it){ it.match = nameScore(base, it.name); });
  var rank = function(a, b){
    if(a.match !== b.match) return b.match - a.match;
    return num(a.price) - num(b.price);
  };
  var imOk = sane.filter(function(it){ return it.src === '사진'; }).sort(rank);
  var nmOk = sane.filter(function(it){ return it.src === '이름'; }).sort(rank);

  /* 다섯 자리 중 사진에 최대 셋, 나머지는 이름에 준다.
     의심스러운 것은 맨 뒤로 보내 눈으로 확인하실 수 있게만 남긴다. */
  var headCount = Math.min(3, imOk.length);
  return imOk.slice(0, headCount)
             .concat(nmOk, imOk.slice(headCount), odd.sort(byPrice));
}

/* 값이 있는 것 중 싼 순으로 5개를 고른다 */
function applyCandidates(items, how, keepOrder){
  /* 링크가 없는 결과도 받는다. 단가와 이름만 있어도 이익 계산은 된다. */
  var usable = items.filter(function(it){ return num(it.price) > 0; });
  if(!usable.length){
    Progress.close();
    render();
    toast('가격을 읽을 수 있는 결과가 없습니다.','err');
    return;
  }
  /* 두 갈래로 찾은 결과는 이미 순서를 정해두었으므로 다시 줄 세우지 않는다 */
  if(!keepOrder) usable.sort(function(a,b){ return num(a.price) - num(b.price); });
  var picked = usable.slice(0, 5);
  App.pending = {items:picked, how:how, total:usable.length};
  fillCandidates(picked, how, usable.length);
}

async function fillCandidates(picked, how, total){
  var r = App.record;
  App.busy.cn = true;
  App.busy.cnMode = '후보 채우는 중';
  Progress.step('후보 카드에 채우는 중');
  render();
  for(var i = 0; i < 5; i++){
    var it = picked[i];
    if(!it){ r.candidates[i] = blankCandidate(); continue; }
    var image = it.image ? await Assets.store(it.image) : '';
    r.candidates[i] = {
      url: it.url || '',
      name: it.name || '',
      price: it.price ? String(it.price) : '',
      moq: it.moq || '',
      opt: it.sold ? ('판매 '+it.sold) : '',
      image: image,
      src: it.src || '',
      warn: it.warn || ''
    };
  }
  r.selected = 0;
  App.busy.cn = false;
  App.busy.cnMode = '';
  Progress.close();
  render();
  saveRecord(true);
  /* 다 찾았으면 1688 탭은 모두 닫고 이 화면만 남긴다 */
  Ext.close1688Tabs(false);
  toast(how+'으로 '+nf(total)+'개 중 가장 싼 '+nf(picked.length)+'개를 채웠습니다');
}

async function fill1688(keyword){
  App.busy.cn = true;
  App.busy.cnMode = '1688 로그인 확인 중';
  render();
  toast('눌렀습니다 · “'+keyword+'” 로 5개를 찾습니다');

  if(!(await ensure1688Login())){
    App.busy.cn = false; App.busy.cnMode = '';
    render();
    return;
  }
  App.busy.cnMode = '이름으로 1688 검색 중';
  Progress.open('1688 에서 “'+keyword+'” 를 찾는 중입니다', '싼 것부터 5개를 골라 채웁니다.');
  Progress.step('1688 검색 결과 읽는 중');
  render();
  var res = await Ext.search1688(keyword, 20);
  App.busy.cn = false;
  App.busy.cnMode = '';
  if(!res.ok){
    Progress.close();
    render();
    toast(res.error || '1688 검색에 실패했습니다.','err');
    return;
  }
  var items = (res.data && res.data.items) || [];
  if(!items.length){
    Progress.close();
    render();
    toast('검색 결과가 없습니다. 다른 검색어로 시도해보세요.','err');
    return;
  }
  Progress.step('찾은 상품을 고르는 중');
  App.record.memo = App.record.memo || ('1688 검색어: ' + keyword);
  applyCandidates(items, '이름 검색 “'+keyword+'”');
}

      '</div>';
    var foot = this.el.querySelector('.modal-foot');
    foot.innerHTML =
      '<button class="act" id="pgClose">닫기</button>'+
      '<button class="act primary" id="pgGo">1688 탭으로 가기</button>';

   12-b. 1688 로그인 확인
   1688 은 로그인하지 않으면 상품 목록을 보여주지 않는다.
   그래서 수집을 시작하기 전에 먼저 확인하고, 안 되어 있으면 안내를 띄운다.
   ======================================================================= */
async function is1688LoggedIn(){
  if(!Ext.present) return null;
  var res = await Ext.login1688Status();
  if(!res.ok || !res.data) return null;     /* 확인 불가 — 막지 않는다 */
  return res.data.loggedIn;                 /* true / false / null */
}

var autosave = debounce(function(){ saveRecord(true); }, 1200);

async function saveRecord(silent){
  var r = App.record;
  if(!r) return;
  r.updatedAt = nowIso();
  if(!r.title) r.title = r.coupang.name ? r.coupang.name.slice(0,40) : '새 비교 분석';
  try {
    await Store.set('records/'+r.id, stripId(r));
    [App.records, App.allRecords || []].forEach(function(arr){
      var i = arr.findIndex(function(x){ return x.id === r.id; });
      if(i >= 0) arr[i] = r; else arr.unshift(r);
    });
    if(!silent) toast('저장했습니다');
  } catch(e){
    toast('저장하지 못했습니다: '+(e && e.message ? e.message : '알 수 없는 오류'),'err');
  }
}

async function grabCoupang(){
  var field = $('#cpUrl');
  var url = validUrl(cleanUrl(field.value));
  if(!url){ toast('쿠팡 상품 링크가 올바르지 않습니다. 칸을 비우고 다시 붙여넣어 주세요.','err'); return; }
  if(siteOf(url) !== 'coupang'){ toast('쿠팡 상품 주소가 아닙니다.','err'); return; }
  field.value = url;
  App.record.coupang.url = url;
  App.busy.cp = true; render();
  var res = await Ext.collect(url);
  App.busy.cp = false;
  if(!res.ok){
    render();
    if(res.blocked){ blockedModal(res.error); return; }
    toast(res.error || '수집에 실패했습니다.','err');
    return;
  }
  var d = res.data || {};
  var cp = App.record.coupang;
  cp.url = url;
  if(d.name) cp.name = d.name;
  if(d.category) cp.category = d.category;
  if(d.price) cp.price = num(d.price);
  if(d.rating) cp.rating = d.rating;
  if(d.reviews) cp.reviews = num(d.reviews);
  if(d.image){
    App.imgData[url] = d.image;   /* 1688 이미지 검색에 쓸 원본 */
    cp.image = await Assets.store(d.image);
  }
  if(!App.record.title || App.record.title === '새 비교 분석'){
    App.record.title = (cp.name || '새 비교 분석').slice(0,40);
  }
  /* 값이 틀릴 때 무엇을 보고 그렇게 정했는지 화면에 남긴다 */
  cp.priceSeen = d.priceSeen || '';
  cp.grabbedAt = nowIso();
  cp.grabbedBy = Ext.version || '';
  render();
  autosave();
  toast('쿠팡 상품 정보를 가져왔습니다');
}

async function grabCandidate(i){
  var input = $('[data-url="'+i+'"]');
  var url = validUrl(cleanUrl(input ? input.value : ''));
  if(!url){ toast('1688 상품 링크가 올바르지 않습니다. 칸을 비우고 다시 붙여넣어 주세요.','err'); return; }
  if(siteOf(url) !== '1688'){ toast('1688 상품 주소가 아닙니다.','err'); return; }
  if(!(await ensure1688Login())) return;
  if(input) input.value = url;
  App.record.candidates[i].url = url;
  App.busy['c'+i] = true; render();
  var res = await Ext.collect(url);
  App.busy['c'+i] = false;
  if(!res.ok){ render(); toast(res.error || '수집에 실패했습니다.','err'); return; }
  var d = res.data || {};
  var cd = App.record.candidates[i];
  cd.url = url;
  if(d.name) cd.name = d.name;
  if(d.price) cd.price = String(num(d.price));
  if(d.moq) cd.moq = d.moq;
  if(d.opt) cd.opt = d.opt;
  if(d.image) cd.image = await Assets.store(d.image);
  render();
  autosave();
  toast((i+1)+'번 후보 정보를 가져왔습니다');
}

async function loadRecords(){
  var all = await Store.list('records');
  all = all.map(normalizeRecord);
  all.sort(function(a,b){ return String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')); });
  App.allRecords = all;
  App.records = all.filter(function(r){ return r.ownerId === Auth.user.uid; });
}
async function loadUsers(){
  if(Auth.user.role !== 'admin'){ App.users = []; return; }
  var us = await Store.list('users');
  us.sort(function(a,b){ return String(a.createdAt||'').localeCompare(String(b.createdAt||'')); });
  App.users = us;
}

function cpPid(url){
  var m = String(url || '').match(/\/vp\/products\/(\d+)/);
  return m ? m[1] : '';
}
App.reviewCache = App.reviewCache || {};

function riText(name, d, ins){
  var out = [];
  out.push('[리뷰 분석] '+(name || ''));
  out.push('최근 리뷰 '+d.read+'개'+(d.average ? ' · 평균 별점 '+d.average : '')+(d.total ? ' · 전체 '+d.total+'개' : ''));
  if(ins.summary) out.push('\n총평: '+ins.summary);
  if(ins.good.length){ out.push('\n좋은 점'); ins.good.forEach(function(g){ out.push('- '+g.point+' ('+g.count+'건) "'+g.quote+'"'); }); }
  if(ins.bad.length){ out.push('\n나쁜 점'); ins.bad.forEach(function(g){ out.push('- '+g.point+' ('+g.count+'건) "'+g.quote+'"'); }); }
  if(ins.chance.length){ out.push('\n수입해서 팔 때 노릴 점'); ins.chance.forEach(function(c){ out.push('- '+c); }); }
  if(ins.buyers) out.push('\n구매자: '+ins.buyers);
  if(ins.options) out.push('옵션: '+ins.options);
  return out.join('\n');
}

  var stars = [5,4,3,2,1].map(function(n){
    var pct = num(d.distribution && d.distribution[n]);
    return '<div class="ri-bar"><span>'+n+'점</span><i><b style="width:'+Math.min(100,pct)+'%;"></b></i><em>'+pct+'%</em></div>';
  }).join('');
  var photo = d.reviews.filter(function(r){ return r.photo; }).length;
  var low = d.reviews.filter(function(r){ return r.stars && r.stars <= 3; }).length;
  var item = function(g, kind){
    return '<div class="ri-item '+kind+'"><div class="ri-pt">'+esc(g.point)+
      (g.count ? '<span class="ri-cnt">'+nf(g.count)+'건</span>' : '')+'</div>'+
      (g.quote ? '<div class="ri-q">“'+esc(g.quote)+'”</div>' : '')+'</div>';
  };
  return ''+
    '<div class="ri-top">'+
      '<div class="ri-kpi"><b>'+nf(d.read)+'</b><span>분석한 최근 리뷰</span></div>'+
      '<div class="ri-kpi"><b>'+(d.average ? d.average : '-')+'</b><span>평균 별점</span></div>'+
      '<div class="ri-kpi"><b>'+nf(low)+'</b><span>3점 이하</span></div>'+
      '<div class="ri-kpi"><b>'+nf(photo)+'</b><span>사진 리뷰</span></div>'+
      '<div class="ri-dist">'+stars+'</div>'+
    '</div>'+
    (ins.summary ? '<div class="ri-sum">'+esc(ins.summary)+'</div>' : '')+
    '<div class="ri-grid">'+

/* opts: {url, name, onDone(result)} */
function reviewInsightModal(opts){
  var o = opts || {};
  var pid = cpPid(o.url);
  var wrap = document.createElement('div');
  wrap.className = 'scrim';
  wrap.innerHTML =
    '<div class="modal ri-modal" role="dialog" aria-modal="true" aria-label="리뷰 분석">'+
      '<div class="modal-head"><h3>리뷰 분석 · 최근 100개</h3>'+
        '<p>'+esc(String(o.name || '').slice(0, 70))+'</p></div>'+
      '<div class="modal-body" id="riBody">'+
        '<div class="ri-wait"><span class="spin"></span><span id="riStep">쿠팡에서 최근 리뷰를 받는 중</span></div>'+
      '</div>'+
      '<div class="modal-foot">'+
        '<button class="act" id="riClose">닫기</button>'+
        '<button class="act" id="riAgain" hidden>다시 분석</button>'+
        '<button class="act primary" id="riCopy" hidden>결과 복사</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(wrap);
  var close = function(){ wrap.remove(); };
  wrap.addEventListener('click', function(e){ if(e.target === wrap) close(); });
  $('#riClose', wrap).onclick = close;

  var step = function(t){ var el = $('#riStep', wrap); if(el) el.textContent = t; };
  var fail = function(msg){
    $('#riBody', wrap).innerHTML = '<div class="callout">'+esc(msg)+'</div>';
    $('#riAgain', wrap).hidden = false;
  };

  var run = async function(force){
    $('#riAgain', wrap).hidden = true;
    $('#riCopy', wrap).hidden = true;
    $('#riBody', wrap).innerHTML =
      '<div class="ri-wait"><span class="spin"></span><span id="riStep">쿠팡에서 최근 리뷰를 받는 중</span></div>';
    if(!pid){ fail('쿠팡 상품 주소에서 상품번호를 찾지 못했습니다.'); return; }
    if(!Ext.present){ fail('수집기가 연결되지 않았습니다.'); return; }

    var hit = !force && App.reviewCache[pid];
    var d, ins;
    if(hit){ d = hit.d; ins = hit.ins; }
    else {
      var res = await Ext.coupangReviews(pid, 100);
      if(!res.ok){
        if(res.blocked){ close(); blockedModal(res.error); return; }
        fail(res.error || '쿠팡 리뷰를 받지 못했습니다.');
        return;
      }
      d = res.data || {};
      if(!d.reviews || !d.reviews.length){
        fail(d.empty ? '이 상품에는 아직 리뷰가 없습니다.'
                     : '리뷰를 한 개도 받지 못했습니다. ('+(d.tried || '')+')');
        return;
      }
      step('리뷰 '+nf(d.reviews.length)+'개에서 좋은 점과 나쁜 점을 찾는 중');
      ins = await Sampler.reviewInsight(o.name, d.reviews);
      if(!ins){ fail('리뷰는 '+nf(d.reviews.length)+'개 받았지만 분석하지 못했습니다. 잠시 뒤 다시 분석을 눌러주세요.'); return; }
      App.reviewCache[pid] = { d: d, ins: ins, at: nowIso() };
    }

    $('#riBody', wrap).innerHTML = riBody(o.name, d, ins);
    $('#riAgain', wrap).hidden = false;
    var cp = $('#riCopy', wrap);
    cp.hidden = false;
    cp.onclick = function(){
      navigator.clipboard.writeText(riText(o.name, d, ins)).then(
        function(){ toast('분석 결과를 복사했습니다'); },
        function(){ toast('복사하지 못했습니다.','err'); }
      );
    };
    if(o.onDone) o.onDone({ d: d, ins: ins });
  };
  $('#riAgain', wrap).onclick = function(){ run(true); };
  run(false);
}

      r.candidates[i][t.getAttribute('data-f')] = t.value;
      refreshCalc(); autosave();
    }
  });
}

/* 선택은 화면을 다시 그리지 않고 표시만 바꾼다 — 입력 중인 칸을 건드리지 않기 위해서다 */
function applySelect(i){
  var r = App.record;
  r.selected = i;
  $$('.item').forEach(function(el){
    el.classList.toggle('sel', num(el.getAttribute('data-i')) === i);
  });
  var desc = $('.calc-head .desc');
  if(desc) desc.textContent = (i+1)+'번 후보 기준 · 환율, 관세, 수수료, 배송비가 반영됩니다.';
  refreshCalc();
}

/* update numbers in place so typing does not lose focus */
function refreshCalc(){
  var r = App.record, c = calc(r);
  var set = function(sel, txt){ var el = $(sel); if(el) el.textContent = txt; };
  var tiles = $$('.tiles .tile');
  if(tiles.length === 5){
    $('.t1 .v').textContent = won(c.goods);
    $('.t1 .s').textContent = '¥'+c.cny.toFixed(2)+' × '+num(c.s.rate).toFixed(2)+'원';
    $('.t2 .v').textContent = won(c.arrival);
    $('.t2 .s').textContent = '상품가격 + 모든비용 '+won(c.extra);
    $('.t3 .v').textContent = won(c.total);
    $('.t3 .s').textContent = '원가 + 수수료 '+won(c.fee)+' + 배송 '+won(c.logistics);
    $('.t4 .v').textContent = won(c.sell);
    var t5 = $('.t5');
    t5.classList.toggle('loss', c.profit < 0);
    $('.t5 .k').textContent = c.profit < 0 ? '1개 팔면 나는 손실' : '1개 팔면 남는 이익금';
    $('.t5 .v').textContent = won(c.profit);
    $('.t5 .s').textContent = '이익률 '+c.margin.toFixed(1)+'% · 월 '+won(c.monthly);
  }
  var sum = $('#calcSummary');
  if(sum) sum.innerHTML = summaryRows(c);
  var stats = $$('.stats .stat .v');
  if(stats.length === 4){
    stats[0].textContent = num(c.s.feeRate).toFixed(2)+'%';
    stats[1].textContent = won(c.fee);
    stats[2].textContent = won(c.logistics);
    stats[3].textContent = nf(c.qty)+'개';
  }
  var best = -1, bestP = -Infinity;
  r.candidates.forEach(function(cd,i){
    if(!num(cd.price)) return;
    var p = calcFor(r,i).profit;
    if(p > bestP){ bestP = p; best = i; }
  });
  $$('.item').forEach(function(el){
    var i = num(el.getAttribute('data-i'));
    var cd = r.candidates[i];
    var ci = calcFor(r,i);
    var has = num(cd.price) > 0;
    var v = $('.mini-profit .v', el);
    if(v){
      v.textContent = has ? won(ci.profit) : '-';
      v.classList.toggle('neg', has && ci.profit < 0);
    }
    var badge = $('.best', el);
    if(i === best && has){
      if(!badge){
        badge = document.createElement('span');
        badge.className = 'best';
        badge.textContent = '최고 이익';
        el.insertBefore(badge, el.firstChild);
      }
    } else if(badge){
      badge.remove();
    }
  });
}

/* 여러 건을 한 번에 지운다. 되돌릴 수 없으니 반드시 확인을 받는다. */
async function deleteRecords(ids, label){
  if(!ids.length) return;
  var ok = await confirmModal('기록 삭제',
    label+' '+nf(ids.length)+'건을 지웁니다. 되돌릴 수 없습니다.', true);
  if(!ok) return;

  var done = 0, failed = 0;
  toast(nf(ids.length)+'건을 지우는 중입니다');
  for(var i = 0; i < ids.length; i++){
    try {
      await Store.del('records/'+ids[i]);
      delete App.picked[ids[i]];
      done++;
    } catch(e){ failed++; }
  }
  if(App.record && ids.indexOf(App.record.id) >= 0) App.record = null;
  await loadRecords();
  render();
  toast(failed
    ? nf(done)+'건을 지웠습니다. '+nf(failed)+'건은 실패했습니다.'
    : nf(done)+'건을 지웠습니다');
}

      toast('클립보드에 JSON을 복사했습니다');
    } catch(e){
      toast('내보내기를 사용할 수 없습니다.','err');
    }
  };
}

function stripId(o){ var c = Object.assign({}, o); delete c._id; return c; }

function bindSettings(){
  var fxNow = $('#fxNow');
  if(fxNow) fxNow.onclick = async function(){
    App.busy.fx = true; render();
    var ok = await refreshFx(true, false);
    render();
    if(ok) toast('환율을 '+num(App.fx.rate).toFixed(2)+'원으로 갱신했습니다');
  };
  $('#saveDefaults').onclick = async function(){
    var s = Object.assign({}, DEFAULTS, {
      rate:num($('#dRate').value),
      multiplier:num($('#dMul').value) || DEFAULTS.multiplier,
      feeRate:num($('#dFee').value),
      logistics:num($('#dLog').value)
    });
    Auth.user.settings = s;
    await Store.set('users/'+Auth.user.uid, stripId(Auth.user));
    toast('기본 계산값을 저장했습니다');
  };
  $('#saveAccount').onclick = async function(){
    var name = $('#sName').value.trim();
    var oldPw = $('#pwOld').value, newPw = $('#pwNew').value;
    if(!name){ toast('이름을 입력해주세요.','err'); return; }
    if(newPw){
      if(newPw.length < 6){ toast('새 비밀번호는 6자 이상이어야 합니다.','err'); return; }
      var h = await sha256(Auth.user.salt+':'+oldPw);
      if(h !== Auth.user.hash){ toast('현재 비밀번호가 올바르지 않습니다.','err'); return; }
      Auth.user.salt = rid('s');
      Auth.user.hash = await sha256(Auth.user.salt+':'+newPw);
    }
    Auth.user.name = name;
    await Store.set('users/'+Auth.user.uid, stripId(Auth.user));
    render();
    toast(newPw ? '이름과 비밀번호를 변경했습니다' : '이름을 변경했습니다');
  };
}

/* =======================================================================
   15. render
   ======================================================================= */
function restoreScroll(y){
  if(!y) return;
  window.scrollTo(0, y);
  requestAnimationFrame(function(){
    window.scrollTo(0, y);
    requestAnimationFrame(function(){ window.scrollTo(0, y); });
  });
}

function render(){
  if(!Auth.user){ renderAuth(); return; }
  /* 표를 다시 그려도 보던 자리에 머물게 한다. 화면을 갈아탈 때만 위로 올린다. */
  var keepY = window.scrollY || document.documentElement.scrollTop || 0;
  if(App.route === 'compare' && !App.record) App.record = blankRecord(Auth.user);
  if(App.route === 'admin' && Auth.user.role !== 'admin') App.route = 'dash';
  if(App.route === 'rank' && !App.rank.items.length) App.route = 'keywords';

  var inner =
    App.route === 'compare'  ? viewCompare()  :
    App.route === 'keywords' ? viewKeywords() :
    App.route === 'auto'     ? viewAuto()     :
    App.route === 'cat'      ? viewCatBest()  :
    App.route === 'taobao'   ? viewTaobao()   :
    App.route === 'temu'     ? viewTemu()     :
    App.route === 'rank'     ? viewRank()     :
    App.route === 'list'     ? viewList()     :
    App.route === 'admin'    ? viewAdmin()    :
    App.route === 'guide'    ? viewGuide()    :
    App.route === 'settings' ? viewSettings() : viewDash();

  $('#root').innerHTML = shell(inner);
  if(App.jumpTop){ App.jumpTop = false; keepY = 0; }
  /* 새로 그린 내용의 높이가 잡히기 전에 되돌리면 브라우저가 맨 위로 깎아버린다.
     그래서 바로 한 번, 다음 그림틀에서 한 번 더 되돌린다. */
  restoreScroll(keepY);
  document.removeEventListener('click', listClick);
  bindCommon();
  if(App.route === 'compare') bindCompare();
  if(App.route === 'keywords') bindKeywords();
  if(App.route === 'auto') bindAuto();
  if(App.route === 'cat') bindCatBest();
  if(App.route === 'taobao') bindTaobao();
  if(App.route === 'temu') bindTemu();
  if(App.route === 'rank') bindRank();
  if(App.route === 'list' || App.route === 'admin'){ bindList(); bindRowActions(); }
  if(App.route === 'admin') bindAdmin();
  if(App.route === 'settings') bindSettings();
  var apiBtn = $('#apiOpen');
  if(apiBtn) apiBtn.onclick = openApiSettings;
  if(App.route === 'guide'){
    var co = $('#copyOrigin');
    if(co) co.onclick = function(){
      var line = $('#originLine').textContent;
      navigator.clipboard.writeText(line).then(
        function(){ toast('허용 주소를 복사했습니다'); },
        function(){ toast('복사하지 못했습니다. 직접 선택해 복사해주세요.','err'); }
      );
    };
  }
}

async function boot(){
  await loadFx();
  await loadRecords();
  await loadUsers();
  if(!App.record) App.record = App.records[0] ? normalizeRecord(App.records[0]) : blankRecord(Auth.user);
  var h = (location.hash||'').replace('#/','');
  if(ROUTES.indexOf(h) >= 0) App.route = h;
  render();

  checkApiKey().then(render);

  /* 로그인할 때마다 최신 환율을 받아온다. 화면을 막지 않고 뒤에서 진행한다. */
  var before = App.fx ? num(App.fx.rate) : 0;
  refreshFx(false, true).then(function(ok){
    if(!ok) return;
    render();
    var now = num(App.fx.rate);
    if(before && Math.abs(now - before) > 0.004){
      toast('환율이 '+before.toFixed(2)+'원에서 '+now.toFixed(2)+'원으로 바뀌어 모든 기록에 반영했습니다');
    }
  });
}

window.addEventListener('hashchange', function(){
  var h = (location.hash||'').replace('#/','');
  if(!Auth.user) return;
  if(ROUTES.indexOf(h) >= 0 && h !== App.route){
    App.route = h; render();
  }
});

Ext.onChange = function(){
  if(!Auth.user) return;
  render();
  /* 확장프로그램이 뒤늦게 붙었다면 그때 환율과 키 상태를 확인한다 */
  if(!App.fx) refreshFx(false, true).then(function(ok){ if(ok) render(); });
  if(App.apiKey === null) checkApiKey().then(render);
};
Ext.init();

/* first paint: the login screen, then resume a session if there is one */
renderAuth();
(async function(){
  await Store.init();
  var u = await Auth.resume();
  if(u) await boot();
})();

})();
</script>
